function buildTVContent(){
  // حساب الترتيب (نفس منطق الداشبورد)
  const byStudent={};
  students.forEach(st=>{
    const k=sidKey({sid:st.id});
    const stCourses=allCourses.filter(c=>sidKey(c)===k);
    if(!stCourses.length)return;
    const done=completedCourses(stCourses); // المعدل من المكتملة فقط
    const sumPct=done.reduce((a,c)=>a+c.pct,0);
    const sumAbs=stCourses.reduce((a,c)=>a+(c.abs||0),0);
    byStudent[st.id]={sid:st.id,name:st.name,grp:st.grp,courses:stCourses,sumPct,sumAbs,nDone:done.length,n:stCourses.length};
  });
  let ranked=Object.values(byStudent).map(s=>({
    name:s.name,grp:s.grp,avg:s.nDone?Math.round(s.sumPct/s.nDone*10)/10:0,gpa:parseFloat(gpaFrom(s.courses)),
    avgAbs:s.n?Math.round(s.sumAbs/s.n):0
  })).sort((a,b)=>b.avg-a.avg||b.gpa-a.gpa);
  ranked.forEach((s,i)=>s.rank=i+1);
  const top3=ranked.slice(0,3);
  // معطيات
  const totStudents=students.length;
  const totCourses=[...new Set(allCourses.map(c=>c.course))].length;
  const totTrainers=[...new Set(allCourses.map(c=>c.trainer).filter(Boolean))].length;
  const grps=[...new Set(students.map(s=>s.grp))].length;
  const avgAll=avgPct(allCourses);
  const excellentCount=ranked.filter(s=>s.avg>=90).length;
  const passRate=ranked.length?Math.round(ranked.filter(s=>s.avg>=60).length/ranked.length*100):0;
  const podiumOrder=[top3[1],top3[0],top3[2]].filter(Boolean);
  const podiumH=[130,175,105];
  const podiumC=['#c0c0c0','#ffd700','#cd7f32'];
  const nm=n=>n.split(' ').slice(0,3).join(' ');
  // رسم توزيع المعدلات
  const bands=[
    {lbl:'ممتاز 90+',min:90,max:101,c:'#2ecc71'},
    {lbl:'جيد جداً 80-89',min:80,max:90,c:'#6ab8f7'},
    {lbl:'جيد 70-79',min:70,max:80,c:'#c9a227'},
    {lbl:'مقبول 60-69',min:60,max:70,c:'#e67e22'},
    {lbl:'ضعيف <60',min:0,max:60,c:'#e74c3c'}
  ];
  const counts=bands.map(b=>ranked.filter(s=>s.avg>=b.min&&s.avg<b.max).length);
  const maxC=Math.max(1,...counts);
  const chartBars=bands.map((b,i)=>{
    const h=Math.round(counts[i]/maxC*100);
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;gap:.5vh">
      <div style="font-size:1.8vh;font-weight:800;color:${b.c}">${counts[i]}</div>
      <div style="width:70%;height:${h}px;min-height:4px;background:linear-gradient(180deg,${b.c},${b.c}aa);border-radius:4px 4px 0 0"></div>
      <div style="font-size:1.1vh;color:#b8c5d8;text-align:center;line-height:1.2">${b.lbl}</div>
    </div>`;
  }).join('');
  return `
  <div class="tv-head">
    <img src="${(document.querySelector('link[rel="icon"]')||{}).href||''}" class="tv-logo">
    <div class="tv-title">معهد مسك</div>
    <div class="tv-sub">🏆 لوحة الشرف والإحصائيات · <span id="tvClock">${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span> · <span style="color:#2ecc71;font-weight:700"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2ecc71;animation:pulse 1.5s infinite;margin-left:4px"></span>مباشر</span></div>
  </div>
  <div class="tv-stats">
    <div class="tv-stat"><div class="tv-snum">${totStudents}</div><div class="tv-slbl">🎓 المتدربون</div></div>
    <div class="tv-stat"><div class="tv-snum">${totCourses}</div><div class="tv-slbl">📚 المقررات</div></div>
    <div class="tv-stat"><div class="tv-snum">${totTrainers}</div><div class="tv-slbl">👨‍🏫 المدربون</div></div>
    <div class="tv-stat"><div class="tv-snum">${grps}</div><div class="tv-slbl">🏫 الشعب</div></div>
    <div class="tv-stat"><div class="tv-snum" style="color:${avgAll>=70?'#2ecc71':avgAll>=50?'#ffd700':'#e74c3c'}">${avgAll}%</div><div class="tv-slbl">📊 متوسط الإنجاز</div></div>
    <div class="tv-stat"><div class="tv-snum" style="color:#2ecc71">${passRate}%</div><div class="tv-slbl">✅ نسبة النجاح</div></div>
    <div class="tv-stat"><div class="tv-snum" style="color:#c9a227">${excellentCount}</div><div class="tv-slbl">⭐ المتفوقون</div></div>
  </div>
  <div class="tv-body3">
    <div class="tv-col">
      <div class="tv-section-title">🏆 منصة التتويج</div>
      <div class="tv-podium">
        ${podiumOrder.map((s,i)=>{
          const h=podiumH[i],clr=podiumC[i],r=s.rank;
          return `<div class="tv-pod-col">
            <div class="tv-pod-medal">${r===1?'🥇':r===2?'🥈':'🥉'}</div>
            <div class="tv-pod-name">${nm(s.name)}</div>
            <div class="tv-pod-info">شعبة ${esc(s.grp)} · ${s.avg}%</div>
            <div class="tv-pod-bar" style="height:${h}px;background:linear-gradient(180deg,${clr},${clr}bb);box-shadow:0 -4px 24px ${clr}66">
              <span class="tv-pod-rank">${r}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
      <div class="tv-section-title" style="margin-top:1vh">📈 توزيع المعدلات</div>
      <div style="display:flex;align-items:flex-end;gap:.6vw;height:14vh;background:rgba(255,255,255,.04);border-radius:12px;padding:1vh .8vw">${chartBars}</div>
    </div>
    <div class="tv-col">
      <div class="tv-section-title">📋 الترتيب العام</div>
      <div class="tv-list">
        ${ranked.slice(0,12).map(s=>`<div class="tv-row${s.rank<=3?' tv-row-top':''}">
          <div class="tv-rank">${s.rank<=3?['🥇','🥈','🥉'][s.rank-1]:s.rank}</div>
          <div class="tv-name">${nm(s.name)}</div>
          <div class="tv-grp">شعبة ${esc(s.grp)}</div>
          <div class="tv-avg" style="color:${s.avg>=80?'#2ecc71':s.avg>=60?'#ffd700':'#e74c3c'}">${s.avg}%</div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}
function openTVMode(){
  // ⭐ حاجز يمنع الاستدعاء المزدوج (onclick المباشر + المعالج الاحتياطي) الذي كان يخرّب ملء الشاشة
  if(window._tvBusy)return;
  window._tvBusy=true;
  setTimeout(()=>{window._tvBusy=false;},700);
  try{
    // ⭐ إزالة شاشة البداية نهائياً حتى لا تغطي شاشة العرض (نفس طبقة z-index سابقاً)
    const sp=document.getElementById('splash');if(sp)sp.remove();
    let tv=document.getElementById('tvMode');
    if(!tv){
      tv=document.createElement('div');
      tv.id='tvMode';
      tv.className='tv-mode';
      document.body.appendChild(tv);
    }
    let content='';
    try{content=buildTVContent();}
    catch(err){content='<div style="color:#fff;text-align:center;padding:40px">تعذّر تحميل شاشة العرض<br><small style="color:#b8c5d8">'+err.message+'</small></div>';}
    tv.innerHTML='<button class="tv-close" onclick="closeTVMode()" title="خروج (ESC)">✕</button>'+content;
    tv.style.display='flex';
    // ملء الشاشة الحقيقي (اختياري تماماً — الشاشة تظهر كطبقة كاملة حتى لو فشل ملء الشاشة)
    setTimeout(()=>{
      try{
        const rq=tv.requestFullscreen||tv.webkitRequestFullscreen||tv.msRequestFullscreen;
        if(rq){const p=rq.call(tv);if(p&&p.catch)p.catch(()=>{});}
      }catch(e){}
    },50);
    // تحديث تلقائي كل 30 ثانية
    if(window._tvTimer)clearInterval(window._tvTimer);
    window._tvTimer=setInterval(async()=>{
      if(!document.getElementById('tvMode')||tv.style.display==='none'){clearInterval(window._tvTimer);return;}
      try{await loadAdmin();tv.innerHTML='<button class="tv-close" onclick="closeTVMode()" title="خروج (ESC)">✕</button>'+buildTVContent();}catch(e){}
    },30000);
    document.addEventListener('keydown',tvEscHandler);
  }catch(e){
    if(typeof showToast==='function')showToast('تعذّر فتح شاشة العرض: '+e.message,'e');
  }
}
function tvEscHandler(e){if(e.key==='Escape')closeTVMode();}
function closeTVMode(){
  const tv=document.getElementById('tvMode');
  if(tv)tv.style.display='none';
  if(window._tvTimer){clearInterval(window._tvTimer);window._tvTimer=null;}
  document.removeEventListener('keydown',tvEscHandler);
  try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});}catch(e){}
}

async function admAttDelete(recs){
  showToast('جاري الحذف...','i');

  dashboard:()=>{

    // (نفس طريقة صفحة المتدربين showStudentDetail التي تعمل بشكل صحيح)
    const byStudent={};
    students.forEach(st=>{
      const stCourses=allCourses.filter(c=>c.sid===st.id);
      if(!stCourses.length)return;
      const done=completedCourses(stCourses); // المعدل من المكتملة فقط
      const sumPct=done.reduce((a,c)=>a+c.pct,0);
      const sumAbs=stCourses.reduce((a,c)=>a+(c.abs||0),0);
      byStudent[st.id]={sid:st.id,name:st.name,grp:st.grp,courses:stCourses,sumPct,sumAbs,nDone:done.length,n:stCourses.length};
    });
    let ranked=Object.values(byStudent).map(s=>({
      sid:s.sid,name:s.name,grp:s.grp,coursesCount:s.n,
      avg:s.nDone?Math.round(s.sumPct/s.nDone*10)/10:0,
      gpa:parseFloat(gpaFrom(s.courses)),
      avgAbs:s.n?Math.round(s.sumAbs/s.n):0
    })).sort((a,b)=>b.avg-a.avg||b.gpa-a.gpa);

  all_courses:()=>{

  schedule:()=>{
    const grps=[...new Set(students.map(s=>s.grp))].filter(Boolean).sort();
    const cur=window._schedGrp||'all';
    window._schedGrp=cur;
    const isAll=cur==='all';

    const days=activeDays();
    // خلية الجدول لشعبة معينة
    const cell=(g,day,p)=>{
      const grid=schedule[g]||{};
      const slot=day+'|'+p;
      const c=grid[slot];
      return `<td class="sch-cell ${c?'filled':''}" 
        ondragover="event.preventDefault()" ondrop="schDrop(event,'${g}','${slot}')"
        onclick="${c?`schClear('${g}','${slot}')`:''}">
        ${c?`<div class="sch-item" draggable="true" ondragstart="schDrag(event,'${g}','${slot}')">

          <div class="sch-trainer">${esc(c.trainer||'')}</div>
          <select class="sch-room" onclick="event.stopPropagation()" onchange="schSetRoom('${g}','${slot}',this.value)">
            ${LABS.map(l=>`<option value="${l}" ${c.room===l?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>`:'<span class="sch-empty">+</span>'}
      </td>`;
    };
    // جدول شعبة واحدة (HTML)
    const tableFor=(g)=>{
      const cListInfo=coursesForSchedule(g);
      const placedCount=Object.keys(schedule[g]||{}).length;
      const neededCount=cListInfo.reduce((a,c)=>a+c.sessions,0);
      const bAfter=breakAfterPeriod(); // الحصة التي تأتي بعدها الاستراحة
      // بناء رؤوس الأعمدة مع إدراج عمود الاستراحة
      const headCells=[...Array(P).keys()].map(p=>{
        const th=`<th>الحصة ${p+1}<div class="sch-time" style="font-size:9px;margin-top:2px">${periodTime(p)}</div></th>`;

      // بناء خلايا كل يوم مع إدراج خلية الاستراحة
      const rowCells=(g,d)=>[...Array(P).keys()].map(p=>{
        const c=cell(g,d,p);

      }).join('');

      Object.values(schedule[g]||{}).forEach(c=>{const k=normCode(c.code)||c.course;placedByCode[k]=(placedByCode[k]||0)+1;});

            const k=normCode(c.code)||c.course;
            const placed=placedByCode[k]||0;
            const remaining=Math.max(0,c.sessions-placed);

          }).join('')}

      <div class="sch-layout">
        ${palette}
        <div class="sch-wrap"><table class="sch-table">
          <thead><tr><th>اليوم</th>${headCells}</tr></thead>
          <tbody>${days.map(d=>`<tr><td class="sch-pnum">${d}</td>${rowCells(g,d)}</tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    };

  alerts:()=>{
    // كل المواد (بدون فلتر الحالة — لأن حالة الشيت قد لا تكون "حالي" بالضبط)
    const active=allCourses;
    // دالة: هل الطالب راسب في المادة ولم يجتزها بعد؟
    const stillFailed=c=>isFailed(c)&&!allCourses.some(o=>o.sid===c.sid&&normCode(o.code)===normCode(c.code)&&!isFailed(o)&&(parseFloat(o.pct)||0)>=60);
    // تجميع الحالات حسب المادة + الشعبة (لتمييز الشعب عن بعضها — نفس المادة قد تُدرّس لعدة شعب)
    const byCourse={};
    active.forEach(c=>{
      const failed=stillFailed(c);
      const deprived=isDeprived(c.abs);
      const weak=!failed&&(parseFloat(c.pct)||0)>0&&(parseFloat(c.pct)||0)<60; // ضعيف (درجة منخفضة غير راسب رسمي)
      const highAbs=!deprived&&isHighAbs(c);
      if(!failed&&!deprived&&!weak&&!highAbs)return; // لا مشكلة
      const k=c.course+' ⟨شعبة '+(c.grp||'—')+'⟩';
      if(!byCourse[k])byCourse[k]={course:c.course,grp:c.grp||'—',trainer:c.trainer,failed:[],deprived:[],weak:[],highAbs:[]};
      if(failed)byCourse[k].failed.push(c);
      else if(deprived)byCourse[k].deprived.push(c);
      else if(weak)byCourse[k].weak.push(c);
      if(highAbs&&!deprived)byCourse[k].highAbs.push(c);
    });
    const courses=Object.values(byCourse).sort((a,b)=>{
      const byGrp=String(a.grp).localeCompare(String(b.grp),'ar',{numeric:true});
      if(byGrp!==0)return byGrp; // رتّب حسب الشعبة أولاً لتجميعها بصرياً
      return (b.failed.length+b.deprived.length+b.weak.length+b.highAbs.length)-(a.failed.length+a.deprived.length+a.weak.length+a.highAbs.length);
    });
    // إحصائيات علوية
    const totFail=courses.reduce((a,c)=>a+c.failed.length,0);
    const totDep=courses.reduce((a,c)=>a+c.deprived.length,0);
    const totWeak=courses.reduce((a,c)=>a+c.weak.length,0);
    const totAbs=courses.reduce((a,c)=>a+c.highAbs.length,0);
    // صف حالة
    const caseRow=(c,type)=>{
      const cfg={
        failed:{icon:'❌',color:'#e74c3c',bg:'rgba(231,76,60,.08)',lbl:`راسب${(parseFloat(c.pct)||0)>0?` (${Math.round(c.pct)}%)`:''}`,badge:'متطلب'},
        deprived:{icon:'🚫',color:'#e74c3c',bg:'rgba(231,76,60,.08)',lbl:`محروم — غياب ${Math.round(c.abs)}%`,badge:'حرمان'},
        weak:{icon:'📉',color:'#ff8a3c',bg:'rgba(255,138,60,.08)',lbl:`ضعيف — درجة ${Math.round(c.pct)}%`,badge:''},
        highAbs:{icon:'⚠️',color:'#f4c78a',bg:'rgba(244,199,138,.08)',lbl:`غياب ${Math.round(c.abs)}% · ${absLevel(c.abs).label}`,badge:''}
      }[type];
      return `<div onclick="showStudentDetail('${c.sid}')" style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:${cfg.bg};border-radius:8px;cursor:pointer;margin-bottom:5px">
        <span style="font-size:16px">${cfg.icon}</span>
        <span style="flex:1;font-size:13px;font-weight:600">${esc(c.sname.split(' ').slice(0,3).join(' '))}</span>
        <span style="font-size:12px;color:${cfg.color}">${cfg.lbl}</span>
        ${cfg.badge?`<span style="font-size:9px;background:${cfg.color};color:#fff;padding:2px 8px;border-radius:10px;font-weight:700">${cfg.badge}</span>`:''}
        <span style="font-size:11px;color:#6ab8f7">←</span>
      </div>`;
    };
    return `
    <div class="banner"><div><div class="btitle">🔔 الاشعارات الأكاديمية</div><div class="bsub">حالات المتدربين مجمّعة حسب المواد</div></div></div>
    <div class="metrics" style="margin-bottom:20px">
      <div class="mcard mc-r" onclick="showNotifStat('fail')" style="cursor:pointer"><div class="micon">❌</div><div class="mnum cr">${totFail}</div><div class="mlbl">راسبون (متطلبات)</div></div>
      <div class="mcard mc-r" onclick="showNotifStat('dep')" style="cursor:pointer"><div class="micon">🚫</div><div class="mnum cr">${totDep}</div><div class="mlbl">محرومون (غياب)</div></div>
      <div class="mcard mc-y" onclick="showNotifStat('weak')" style="cursor:pointer"><div class="micon">📉</div><div class="mnum cy">${totWeak}</div><div class="mlbl">ضعفاء</div></div>
      <div class="mcard mc-y" onclick="showNotifStat('abs')" style="cursor:pointer"><div class="micon">⚠️</div><div class="mnum cy">${totAbs}</div><div class="mlbl">إنذار غياب</div></div>
    </div>
    ${courses.length?courses.map(c=>{
      const total=c.failed.length+c.deprived.length+c.weak.length+c.highAbs.length;
      return `<div style="background:var(--card,rgba(255,255,255,.03));border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)">
          <div><span style="font-size:15px;font-weight:800;color:#6ab8f7">📚 ${esc(c.course)}</span> <span style="font-size:12px;background:rgba(106,184,247,.15);color:#6ab8f7;padding:2px 10px;border-radius:10px;font-weight:700;margin-inline-start:6px">🏫 شعبة ${esc(c.grp)}</span> <span style="font-size:11px;color:var(--muted)">· ${esc(c.trainer||'—')}</span></div>
          <span style="font-size:11px;background:rgba(231,76,60,.15);color:#e74c3c;padding:3px 10px;border-radius:12px;font-weight:700">${total} حالة</span>
        </div>
        ${c.failed.length?`<div style="font-size:11px;font-weight:700;color:#e74c3c;margin:8px 0 4px">❌ راسبون (${c.failed.length})</div>${c.failed.map(x=>caseRow(x,'failed')).join('')}`:''}
        ${c.deprived.length?`<div style="font-size:11px;font-weight:700;color:#e74c3c;margin:8px 0 4px">🚫 محرومون (${c.deprived.length})</div>${c.deprived.map(x=>caseRow(x,'deprived')).join('')}`:''}
        ${c.weak.length?`<div style="font-size:11px;font-weight:700;color:#ff8a3c;margin:8px 0 4px">📉 ضعفاء (${c.weak.length})</div>${c.weak.map(x=>caseRow(x,'weak')).join('')}`:''}
        ${c.highAbs.length?`<div style="font-size:11px;font-weight:700;color:#f4c78a;margin:8px 0 4px">⚠️ إنذار غياب (${c.highAbs.length})</div>${c.highAbs.map(x=>caseRow(x,'highAbs')).join('')}`:''}
      </div>`;
    }).join(''):'<div class="alert as"><span class="aicon">✅</span>ممتاز! لا توجد حالات تحتاج متابعة</div>'}`;
  },

// يوضع صندوق البحث داخل حاوية فيها [data-listwrap]، ويفلتر صفوف tbody بالنص
function filterList(inp){
  const q=(inp.value||'').trim().toLowerCase();
  const wrap=inp.closest('[data-listwrap]'); if(!wrap)return;
  const tb=wrap.querySelector('tbody'); if(!tb)return;
  let shown=0, real=0;
  tb.querySelectorAll('tr').forEach(tr=>{
    if(tr.hasAttribute('data-empty'))return; // صف "لا يوجد" الأصلي
    real++;
    const hit=!q||tr.textContent.toLowerCase().includes(q);
    tr.style.display=hit?'':'none'; if(hit)shown++;
  });
  let nr=wrap.querySelector('.list-nores');
  if(!nr){ nr=document.createElement('div'); nr.className='list-nores empty'; nr.innerHTML='<div class="empty-icon">🔍</div>لا نتائج مطابقة'; wrap.appendChild(nr); }
  nr.style.display=(real&&!shown)?'block':'none';
  const cl=inp.parentElement.querySelector('.ls-clear'); if(cl)cl.style.display=q?'flex':'none';
}
function filterListClear(btn){ const inp=btn.parentElement.querySelector('input'); if(inp){inp.value='';filterList(inp);inp.focus();} }

/* ========== حارس الخمول: خروج تلقائي حسب الدور ========== */
let _idleTimer=null,_idleWarnTimer=null,_lastActStore=0;
function idleLimitMs(){ return (IDLE_HOURS[role]||24)*3600*1000; }
function markActivity(){
  const now=Date.now();
  localStorage.setItem('misk_last_activity',now);
  const bar=document.getElementById('idleWarn'); if(bar) bar.style.display='none';
  clearTimeout(_idleTimer); clearTimeout(_idleWarnTimer);
  const limit=idleLimitMs();
  _idleWarnTimer=setTimeout(showIdleWarning,Math.max(0,limit-60000));
  _idleTimer=setTimeout(idleLogout,limit);
}
function throttledActivity(){
  const now=Date.now();
  if(now-_lastActStore>5000){ _lastActStore=now; markActivity(); }
}
function showIdleWarning(){
  let bar=document.getElementById('idleWarn');
  if(!bar){
    bar=document.createElement('div');
    bar.id='idleWarn';
    bar.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:linear-gradient(90deg,#c0392b,#e67e22);color:#fff;padding:12px 16px;text-align:center;font-family:Tajawal,Arial,sans-serif;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.3)';
    bar.innerHTML='⏳ جلستك على وشك الانتهاء بسبب عدم النشاط &nbsp; <button onclick="continueSession()" style="background:#fff;color:#c0392b;border:none;border-radius:8px;padding:6px 16px;font-weight:700;cursor:pointer;font-family:inherit">متابعة الجلسة</button>';
    document.body.appendChild(bar);
  }
  bar.style.display='block';
}
function continueSession(){ markActivity(); }
function idleLogout(){
  clearTimeout(_idleTimer); clearTimeout(_idleWarnTimer);
  localStorage.removeItem('misk_last_activity');
  doLogout();
  const eb=document.getElementById('errBox');
  if(eb){ eb.style.display='block'; eb.textContent='🔒 انتهت الجلسة بسبب عدم النشاط. الرجاء تسجيل الدخول مرة أخرى.'; }
}
function initIdleGuard(){
  ['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>
    document.addEventListener(ev,throttledActivity,{passive:true}));
  markActivity();
}
function clearIdleGuard(){
  clearTimeout(_idleTimer); clearTimeout(_idleWarnTimer);
  const bar=document.getElementById('idleWarn'); if(bar) bar.style.display='none';
}

  const rec=document.getElementById('recordCard');

const SPLASH_MIN=2900; // الحد الأدنى لعرض الشاشة (مدة الأنيميشن)
let splashStart=Date.now();
function hideSplash(){
  const sp=document.getElementById('splash');

}

// استرجاع الجلسة عند تحميل الصفحة — سريع: كاش فوري ثم تحديث بالخلفية
async function restoreSession(){
  try{
    const savedUser=localStorage.getItem('bla_user');
    const savedRole=localStorage.getItem('bla_role');
    const savedTok=localStorage.getItem('misk_token');
    if(!savedUser||!savedRole||!savedTok){hideSplash();return;}
    SESSION.token=savedTok;
    const u=JSON.parse(savedUser);
    role=savedRole;
    currentUser=u;
    user=u;
    // فحص الخمول
    const lastAct=parseInt(localStorage.getItem('misk_last_activity')||'0',10);
    const idleLim=(IDLE_HOURS[role]||24)*3600*1000;
    if(lastAct && (Date.now()-lastAct>idleLim)){
      localStorage.removeItem('bla_user');localStorage.removeItem('bla_role');
      localStorage.removeItem('misk_token');localStorage.removeItem('misk_last_activity');
      clearDataSnapshot();
      SESSION.token='';user=null;currentUser=null;
      hideSplash();
      const eb=document.getElementById('errBox');
      if(eb){eb.style.display='block';eb.textContent='🔒 انتهت الجلسة بسبب عدم النشاط. الرجاء تسجيل الدخول مرة أخرى.';}
      return;
    }
    // ⚡ إذا فيه نسخة محفوظة → اعرض التطبيق فوراً ثم حدّث بالخلفية
    if(loadDataSnapshot()){
      showApp(); hideSplash(); initIdleGuard();
      // تحديث صامت بالخلفية
      const refresh=(role==='s')?loadStudent():(role==='t')?loadTrainer():loadAdmin();
      refresh.then(()=>{
        // إعادة رسم اللوحة الحالية بالبيانات الجديدة (بدون قفزة مزعجة)
        try{ if(role==='s') buildStudentApp(); else if(role==='t') buildTrainerApp(); else buildAdminApp(); }catch(e){}
      }).catch(e=>{ if(e&&e.message==='session'){ localStorage.removeItem('misk_token'); location.reload(); } });
      return;
    }
    // بدون كاش: تحميل عادي بشاشة "جاري جلب بياناتك..."
    const st=document.getElementById('splashStatus');if(st)st.textContent='جاري جلب بياناتك...';
    const loadPromise=(role==='s')?loadStudent():(role==='t')?loadTrainer():loadAdmin();
    const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),25000));
    await Promise.race([loadPromise,timeout]);
    showApp();
    hideSplash();
    initIdleGuard();
  }catch(e){
    localStorage.removeItem('bla_user');
    localStorage.removeItem('bla_role');
    user=null;currentUser=null;
    const st=document.getElementById('splashStatus');if(st)st.textContent='تعذّر تحميل البيانات — جاري فتح صفحة الدخول...';
    hideSplash();
  }
}

// Ripple effect on all buttons
document.addEventListener('click', function(e){
  const btn = e.target.closest('button, .btn, .mcard, .ccard');
  if(!btn) return;
  const ripple = document.createElement('span');
  ripple.className = 'ripple-effect';
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px`;
  btn.style.position = 'relative';
  btn.style.overflow = 'hidden';
  btn.appendChild(ripple);
  setTimeout(()=>ripple.remove(), 600);
});

// Stagger animations للبطاقات
function staggerAnimate(selector, animClass, delay=80){
  document.querySelectorAll(selector).forEach((el,i)=>{
    el.style.opacity='0';
    el.style.transform='translateY(30px)';
    setTimeout(()=>{
      el.style.transition=`all 0.8s cubic-bezier(0.16,1,0.3,1)`;
      el.style.opacity='1';
      el.style.transform='translateY(0)';
    }, i*delay);
  });
}

// ترتيب المتدربين (نفس حساب الداشبورد) — للاستخدام في التفاصيل
function studentRanking(){
  const byStudent={};
  students.forEach(st=>{
    const stCourses=allCourses.filter(c=>c.sid===st.id);
    if(!stCourses.length)return;
    const done=completedCourses(stCourses);
    const sumPct=done.reduce((a,c)=>a+c.pct,0);
    const sumAbs=stCourses.reduce((a,c)=>a+(c.abs||0),0);
    byStudent[st.id]={sid:st.id,name:st.name,grp:st.grp,courses:stCourses,sumPct,sumAbs,nDone:done.length,n:stCourses.length};
  });
  return Object.values(byStudent).map(s=>({
    sid:s.sid,name:s.name,grp:s.grp,coursesCount:s.n,
    avg:s.nDone?Math.round(s.sumPct/s.nDone*10)/10:0,
    gpa:parseFloat(gpaFrom(s.courses)),
    avgAbs:s.n?Math.round(s.sumAbs/s.n):0
  })).sort((a,b)=>b.avg-a.avg||b.gpa-a.gpa);
}

// تصنيف حالات الاشعارات (نفس منطق صفحة الاشعارات)
function notifClassified(){
  const stillFailed=c=>isFailed(c)&&!allCourses.some(o=>o.sid===c.sid&&normCode(o.code)===normCode(c.code)&&!isFailed(o)&&(parseFloat(o.pct)||0)>=60);
  const out={failed:[],deprived:[],weak:[],highAbs:[]};
  allCourses.forEach(c=>{
    const failed=stillFailed(c), deprived=isDeprived(c.abs);
    const weak=!failed&&(parseFloat(c.pct)||0)>0&&(parseFloat(c.pct)||0)<60;
    const highAbs=!deprived&&isHighAbs(c);
    if(failed)out.failed.push(c); else if(deprived)out.deprived.push(c); else if(weak)out.weak.push(c);
    if(highAbs&&!deprived)out.highAbs.push(c);
  });
  return out;
}

    courses.forEach((co,i)=>{const cc=tc.filter(c=>c.course===co);const ca=Math.round(cc.reduce((x,c)=>x+c.pct,0)/cc.length);
      html+=`<div onclick="showTrainerCourseStudents(${i})" style="cursor:pointer">${detailRow(esc(co)+' ('+cc.length+' متدرب)',ca+'%',ca>=70?'var(--green)':ca>=60?'var(--gold)':'var(--red)')}</div>`;});
    showDetail((kind==='avg'?'متوسط درجات ':'مقررات ')+t,'📚',html);

}
// متدربو مقرر معيّن لهذا المدرب
function showTrainerCourseStudents(i){
  const t=window._trName, co=(window._trCourses||[])[i];
  if(!t||co==null)return;
  const cc=allCourses.filter(c=>c.trainer===t&&c.course===co).slice().sort((x,y)=>y.pct-x.pct);
  const back=`<div onclick="backToTrainer()" style="cursor:pointer;color:#6ab8f7;font-size:13px;margin-bottom:12px">← رجوع لبطاقة المدرب</div>`;
  let html=back+`<div style="font-size:13px;color:var(--muted);margin-bottom:8px">${esc(co)} — المتدربون (${cc.length}):</div>`;
  cc.forEach(c=>{const nm=c.sname||c.name||c.sid;const extra=isHighAbs(c)?' · غياب '+Math.round(c.abs)+'%':'';
    html+=detailRow(esc(String(nm).split(' ').slice(0,3).join(' '))+' · شعبة '+esc(c.grp||'—'),Math.round(c.pct)+'%'+extra,c.pct>=60?'var(--green)':'var(--red)');});
  showDetail('مقرر: '+co,'📘',html);
}
// تفاصيل المادة عند المدرب — مقسّمة حسب الشعبة (كل شعبة بمتوسطها) + خطة المتطلب
function showTrainerCourseDetail(course){
  // الدفعات الحالية فقط (السابقة مؤرشفة ولا تظهر هنا)
  const recs=uniqStudents(students.filter(s=>s.course===course&&isActive(s.status)));
  if(!recs.length){showDetail('مقرر: '+course,'📘','<div class="alert ab">لا يوجد متدربون في الدفعة الحالية</div>');return;}
  const code=recs[0]?.code||'';
  // خطة المتطلب من قاعدة المقررات
  const cat=(catalog||[]).find(c=>normCode(c.code)===normCode(code));
  const prereq=cat?cat.prereq:'';
  // تجميع حسب الشعبة
  const grps=[...new Set(recs.map(s=>s.grp||'—'))].sort();
  const overallAvg=Math.round(recs.reduce((x,s)=>x+s.pct,0)/recs.length);
  let html=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
    <span style="background:rgba(106,184,247,.12);color:#6ab8f7;border-radius:10px;padding:4px 12px;font-size:12px;font-weight:700">${esc(code)}</span>
    <span style="background:rgba(46,204,113,.12);color:#2ecc71;border-radius:10px;padding:4px 12px;font-size:12px;font-weight:700">${recs.length} متدرب · ${grps.length} شعبة</span>
    <span style="background:${overallAvg>=70?'rgba(46,204,113,.12)':overallAvg>=60?'rgba(244,199,138,.15)':'rgba(231,76,60,.12)'};color:${overallAvg>=70?'#2ecc71':overallAvg>=60?'#f4c78a':'#e74c3c'};border-radius:10px;padding:4px 12px;font-size:12px;font-weight:700">متوسط عام ${overallAvg}%</span>
  </div>`;
  if(prereq)html+=`<div style="margin-bottom:16px"><span style="display:inline-block;background:rgba(244,162,97,.15);color:#f4a261;border:1px solid rgba(244,162,97,.3);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:700">📌 المتطلب السابق: ${esc(prereq)}</span></div>`;
  // كل شعبة على حدة
  grps.forEach(g=>{
    const gs=recs.filter(s=>(s.grp||'—')===g).slice().sort((a,b)=>b.pct-a.pct);
    const ga=Math.round(gs.reduce((x,s)=>x+s.pct,0)/gs.length);
    const gcolor=ga>=70?'#2ecc71':ga>=60?'#f4c78a':'#e74c3c';
    html+=`<div style="margin-bottom:18px;background:var(--card,rgba(255,255,255,.03));border:1px solid var(--border);border-radius:12px;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:linear-gradient(135deg,rgba(10,35,72,.5),rgba(26,58,107,.3));border-bottom:1px solid var(--border)">
        <div style="font-weight:800;font-size:14px;color:var(--text)">🏫 الشعبة ${esc(g)} <span style="font-size:11px;color:var(--muted);font-weight:400">(${gs.length} متدرب)</span></div>
        <span style="background:${gcolor}22;color:${gcolor};border-radius:10px;padding:3px 12px;font-size:13px;font-weight:800">${ga}%</span>
      </div>
      <div style="padding:6px 10px">
        ${gs.map(s=>{const nm=String(s.sname||s.name||s.sid).split(' ').slice(0,3).join(' ');const p=Math.round(s.pct);const ab=Math.round(s.abs)||0;const abTxt=ab>=10?` · <span style="color:${absLevel(s.abs).color}">غياب ${ab}%</span>`:'';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 6px;border-bottom:1px solid rgba(150,150,150,.08);font-size:13px">
            <span>${esc(nm)}${abTxt}</span>
            <span class="pill ${pillClass(p)}" style="font-size:11px">${p}%</span>
          </div>`;}).join('')}
      </div>
    </div>`;
  });
  showDetail('مقرر: '+course,'📘',html);
}

function absBadge(pct){
  const p=Math.round(pct);
  if(p>=25)return `<span class="badge b-r">${p}% محروم</span>`;
  if(p>=20)return `<span class="badge b-y">${p}% إنذار ثانٍ</span>`;

}

// المقررات الحالية ذات الغياب المرتفع (≥10%) لمتدرب معيّن
function highAbsCourses(sid){
  const k=sidKey({sid});
  return allCourses.filter(c=>sidKey(c)===k && isActive(c.status) && (parseFloat(c.abs)||0)>=10)
    .sort((a,b)=>(parseFloat(b.abs)||0)-(parseFloat(a.abs)||0));
}
// كل الطلاب الذين لديهم غياب مرتفع في مقرر واحد على الأقل
function studentsHighAbs(){
  return uniqStudents(students)
    .map(s=>({s, courses:highAbsCourses(s.id||s.sid)}))
    .filter(x=>x.courses.length)
    .sort((a,b)=>{
      const ma=Math.max(...a.courses.map(c=>parseFloat(c.abs)||0));
      const mb=Math.max(...b.courses.map(c=>parseFloat(c.abs)||0));
      return mb-ma;
    });
}

// التاريخ الهجري لليوم (أم القرى)
function hijriToday(){
  try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date());}
  catch(e){return new Date().toLocaleDateString('ar-EG');}
}
function gregToday(){try{return new Date().toLocaleDateString('en-GB');}catch(e){return '';}}

// ===== تنسيق تاريخ الالتحاق (يحوّل صيغة ISO الخام إلى يوم/شهر/سنة نظيف) =====
function fmtJoinDate(v){
  if(v==null) return '';
  const s=String(v).trim();
  if(!s) return '';
  const d=new Date(s);
  if(isNaN(d.getTime())) return s; // ليس تاريخاً — أعده كما هو (مثل نص عادي)
  try{
    const parts=new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Asia/Riyadh'}).formatToParts(d);
    const g=t=>(parts.find(p=>p.type===t)||{}).value||'';
    return g('day')+'/'+g('month')+'/'+g('year');
  }catch(e){
    const pad=n=>String(n).padStart(2,'0');
    return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  }
}

// إرسال خطاب الإنذار بالإيميل للمتدرب عبر Apps Script
async function sendWarningEmail(sid){
  const st=students.find(s=>String(s.id)===String(sid)||String(s.sid)===String(sid))||{};
  if(!st.email||!String(st.email).includes('@')){showToast('لا يوجد إيميل مسجّل لهذا المتدرب','w');return;}
  const courses=highAbsCourses(sid);
  if(!courses.length){showToast('هذا المتدرب ليس لديه غياب مرتفع','i');return;}
  const maxAbs=Math.max(...courses.map(c=>parseFloat(c.abs)||0));
  const level=absLevel(maxAbs).label;
  const details=courses.map(c=>`${esc(c.course)}~${Math.round(c.abs)}~${absLevel(c.abs).label}`).join('|');
  showToast('جاري إرسال الإيميل...','i');
  try{
    const r=await jsonpCall({action:'sendAbsenceWarning',email:st.email,name:st.name||'',grp:st.grp||'',level,details});
    if(r&&r.emailed)showToast('✅ تم إرسال إشعار الغياب لإيميل المتدرب','s');
    else if(r&&r.status==='ok')showToast('⚠️ لم يُرسل — الكود القديم لا يزال منشوراً. انشر نسخة جديدة من Apps Script (Manage deployments > Edit > New version)','w');
    else showToast('تعذّر الإرسال: '+((r&&r.msg)||'خطأ'),'e');
  }catch(e){showToast('تعذّر الإرسال — تأكد من نشر Apps Script الجديد','e');}
}
// إرسال جماعي لكل المتجاوزين
async function sendAllWarningEmails(){
  const list=studentsHighAbs().filter(x=>x.s.email&&String(x.s.email).includes('@'));
  if(!list.length){showToast('لا يوجد طلاب لديهم إيميل مسجّل وغياب مرتفع','i');return;}
  if(!confirm(`سيتم إرسال إشعار غياب لـ ${list.length} متدرب. متابعة؟`))return;
  let ok=0,fail=0;
  for(const {s} of list){
    try{await sendWarningEmail(s.id||s.sid);ok++;}catch(e){fail++;}
    await new Promise(r=>setTimeout(r,400));
  }
  showToast(`تم الإرسال — نجح ${ok}${fail?` · فشل ${fail}`:''}`,ok?'s':'e');
}

function printAbsenceReport(){
  const grps=[...new Set(students.map(s=>s.grp))].filter(Boolean).sort();
  const deprived=allCourses.filter(c=>c.abs>=25);
  const warn2=allCourses.filter(c=>c.abs>=20&&c.abs<25);
  const warn1=allCourses.filter(c=>c.abs>=10&&c.abs<20);
  let body=`<div class="kpis">
    <div class="kpi"><div class="n">${students.length}</div><div class="l">إجمالي المتدربين</div></div>
    <div class="kpi"><div class="n" style="color:#c0392b">${deprived.length}</div><div class="l">حالات حرمان (≥25%)</div></div>
    <div class="kpi"><div class="n" style="color:#d68910">${warn2.length}</div><div class="l">إنذار ثانٍ (≥20%)</div></div>
    <div class="kpi"><div class="n" style="color:#d68910">${warn1.length}</div><div class="l">إنذار أول (≥10%)</div></div>
  </div>`;
  grps.forEach(g=>{
    const gs=uniqStudents(students.filter(s=>s.grp===g));
    if(!gs.length)return;
    const rows=gs.map(s=>{
      const sc=allCourses.filter(c=>c.sid===s.id&&isActive(c.status));
      const maxAbs=sc.length?Math.max(...sc.map(c=>c.abs)):0;
      const worst=sc.find(c=>c.abs===maxAbs);
      return `<tr><td>${s.sid}</td><td style="text-align:right">${esc(s.name)}</td><td>${absBadge(maxAbs)}</td><td>${worst?worst.course:'—'}</td><td>${sc.length}</td></tr>`;
    }).join('');
    body+=`<div class="grp-block"><div class="sec-title">📋 الشعبة ${g} (${gs.length} متدرب)</div>
    <table><thead><tr><th>الرقم</th><th>الاسم</th><th>أعلى نسبة غياب</th><th>في مادة</th><th>عدد المواد</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  });
  openReport(reportShell('تقرير الغياب الشامل','تقرير الغياب الشامل لجميع المتدربين',body));
}

function printControlSheet(){
  const grps=[...new Set(students.map(s=>s.grp))].filter(Boolean).sort((a,b)=>String(a).localeCompare(String(b),'ar',{numeric:true}));
  let body='';
  grps.forEach(g=>{
    const gs=uniqStudents(students.filter(s=>String(s.grp)===String(g)))
      .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ar'));
    if(!gs.length)return;
    const sids=new Set(gs.map(s=>String(s.id||s.sid)));
    // مواد هذه الشعبة (الحالية) — بدون تكرار بالرمز
    const cmap=new Map();
    (allCourses||[]).forEach(c=>{
      if(!sids.has(String(c.sid))||!isActive(c.status))return;
      const k=normCode(c.code); if(!k)return;
      if(!cmap.has(k))cmap.set(k,{code:c.code,course:c.course,cats:rubricFor(c.code)});
    });
    const courses=[...cmap.values()];
    if(!courses.length)return;
    // ترويسة عمودية (صفّان) + صف الدرجة العظمى
    let h1=`<th rowspan="2" style="width:26px">م</th><th rowspan="2" class="nm">اسم الطالب</th><th rowspan="2" style="width:90px">الرقم التدريبي</th>`;
    let h2='', h3='';
    courses.forEach(co=>{
      const cats=co.cats||[];
      const span=(cats.length||1)+1;
      h1+=`<th colspan="${span}" class="cgrp">${esc(co.course||co.code)}</th>`;
      if(cats.length){
        cats.forEach(ct=>{h2+=`<th>${esc(ct.cat)}</th>`;});
        h2+=`<th class="tot">مجموع</th>`;
        cats.forEach(ct=>{h3+=`<th>${ct.max}</th>`;});
        h3+=`<th>${cats.reduce((a,c)=>a+(parseFloat(c.max)||0),0)||100}</th>`;
      }else{
        h2+=`<th>الدرجة</th><th class="tot">مجموع</th>`;
        h3+=`<th>100</th><th>100</th>`;
      }
    });
    const rows=gs.map((s,i)=>{
      const ssid=String(s.id||s.sid||'');
      let tds=`<td>${i+1}</td><td class="nm">${esc(s.name||'')}</td><td>${esc(ssid)}</td>`;
      courses.forEach(co=>{
        const c=(allCourses||[]).find(x=>String(x.sid)===ssid&&normCode(x.code)===normCode(co.code)&&isActive(x.status));
        const key=c?c.key:'';
        if((co.cats||[]).length){
          let sum=0,any=false,cells='';
          co.cats.forEach(ct=>{
            const v=key?detailGrade(key,co.code,ct.cat):'';
            if(v!==''&&v!=null){sum+=parseFloat(v)||0;any=true;cells+=`<td>${v}</td>`;}
            else cells+=`<td class="g">غ</td>`;
          });
          const total=any?(Math.round(sum*10)/10):(c&&c.pct?Math.round(c.pct):'');
          tds+=cells+`<td class="tot">${total!==''?total:'—'}</td>`;
        }else{
          const grade=(c&&c.pct)?Math.round(c.pct):'';
          tds+=`<td>${grade!==''?grade:'—'}</td><td class="tot">${grade!==''?grade:'—'}</td>`;
        }
      });
      return `<tr>${tds}</tr>`;
    }).join('');
    body+=`<div class="cs-block"><div class="cs-title">🎛️ شيت كنترول — الشعبة ${esc(String(g))} <span style="font-size:11px;opacity:.85">(${gs.length} متدرب · ${courses.length} مادة)</span></div>
      <table class="cs"><thead>
        <tr>${h1}</tr>
        <tr>${h2}</tr>
        <tr class="mxr"><th colspan="3" style="text-align:center">الدرجة العظمى ←</th>${h3}</tr>
      </thead><tbody>${rows}</tbody></table></div>`;
  });
  if(!body){showToast('لا توجد شعب أو درجات لعرضها','w');return;}
  openReport(controlShell(body));
}

// ===== سجل الغياب اليومي لكل مادة (يجمع كل التواريخ في جدول واحد) =====
function printDailyAbsenceByCourse(){
  const rows=(typeof absenceRows!=='undefined'&&Array.isArray(absenceRows))?absenceRows:[];
  if(rows.length<2){showToast('لا يوجد سجل غياب يومي بعد','w');return;}
  const dig=s=>String(s||'').replace(/[^0-9]/g,'');
  const fmt=v=>{const s=String(v||'').trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)return s.slice(0,10);const d=new Date(s);return isNaN(d)?s:(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear());};
  const dnum=d=>{const m=String(d).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);return m?((m[3].length===2?'20'+m[3]:m[3])+m[2].padStart(2,'0')+m[1].padStart(2,'0')):'0';};
  const courses=new Map(); // key=cnk(cname) -> {course, dates:Set, studs:Map(sid->{sid,name,byDate})}
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const sid=dig(r[0]); if(!sid)continue;
    const cname=r[2]||'—', date=fmt(r[5]), status=String(r[6]||'').trim()||'غائب';
    const k=cnk_(cname);
    if(!courses.has(k))courses.set(k,{course:cname,dates:new Set(),studs:new Map()});
    const C=courses.get(k); C.dates.add(date);
    if(!C.studs.has(sid))C.studs.set(sid,{sid,name:r[1]||'',byDate:{}});
    C.studs.get(sid).byDate[date]=status;
  }
  let body='';
  [...courses.values()].sort((a,b)=>String(a.course).localeCompare(String(b.course),'ar')).forEach(C=>{
    const dates=[...C.dates].sort((a,b)=>dnum(a).localeCompare(dnum(b)));
    const studs=[...C.studs.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),'ar'));
    const head=`<th style="width:26px">م</th><th class="nm">الاسم</th><th style="width:80px">الرقم</th>${dates.map(d=>`<th class="dt">${esc(d)}</th>`).join('')}<th>غياب</th><th>تأخير</th>`;
    const trs=studs.map((s,i)=>{
      let absN=0,lateN=0;
      const cells=dates.map(d=>{const st=s.byDate[d];
        if(st==='غائب'){absN++;return '<td class="g">غ</td>';}
        if(st==='متأخر'){lateN++;return '<td class="l">ت</td>';}
        if(st==='حاضر')return '<td class="p">✓</td>';
        return '<td></td>';}).join('');
      return `<tr><td>${i+1}</td><td class="nm">${esc(s.name)}</td><td>${esc(s.sid)}</td>${cells}<td class="g">${absN||''}</td><td class="l">${lateN||''}</td></tr>`;
    }).join('');
    body+=`<div class="cs-block"><div class="cs-title">📉 ${esc(C.course)} — سجل الغياب اليومي <span style="font-size:11px;opacity:.85">(${dates.length} يوم · ${studs.length} متدرب)</span></div>
      <table class="cs"><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table>
      <div style="font-size:10px;color:#5a6b85;margin-top:4px">غ = غائب · ت = متأخر · ✓ = حاضر</div></div>`;
  });
  openReport(controlShell(body));
}

      const uniq=uniqStudents(cc.map(c=>{const st=students.find(s=>s.id===c.sid);return{...c,sid:c.sid,name:st?st.name:c.sname,grp:g};}));
      const rows=uniq.map(c=>{

    });
  });
  openReport(reportShell('تقرير الدرجات المفصّل','كشف الدرجات المفصّل لكل شعبة ومادة',body));

// ===== 4) تقرير الأعذار والطلبات =====
function printRequestsReport(){
  const reqs=requests||[];
  const approved=reqs.filter(r=>reqFinal(r)==='معتمد');
  const pending=reqs.filter(r=>{const f=reqFinal(r);return f==='قيد المراجعة'||f==='بانتظار التعديل';});
  const rejected=reqs.filter(r=>reqFinal(r)==='مرفوض');
  const statusOf=r=>{
    const f=reqFinal(r);
    if(f==='معتمد')return '<span class="badge b-g">معتمد</span>';
    if(f==='مرفوض')return '<span class="badge b-r">مرفوض</span>';
    if(f==='بانتظار التعديل')return '<span class="badge b-y">بانتظار تعديل</span>';
    return '<span class="badge b-y">قيد المراجعة</span>';
  };
  const rows=reqs.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>{
    const days=((String(r.details||'').match(/الأيام:\s*([^|]+)/)||[])[1]||'').trim();
    const hours=((String(r.details||'').match(/ساعات:\s*([\d.]+)/)||[])[1]||'');
    return `<tr><td>${r.date||'—'}</td><td style="text-align:right">${esc(r.sname||'')}</td><td>${esc(r.grp||'')}</td><td>${esc(REQ_CATS[reqCat(r)].label)}</td><td style="font-size:10px">${days||'—'}</td><td>${hours||'—'}</td><td>${statusOf(r)}</td></tr>`;
  }).join('');
  const body=`<div class="kpis">
    <div class="kpi"><div class="n">${reqs.length}</div><div class="l">إجمالي الطلبات</div></div>
    <div class="kpi"><div class="n" style="color:#1e8449">${approved.length}</div><div class="l">معتمدة</div></div>
    <div class="kpi"><div class="n" style="color:#d68910">${pending.length}</div><div class="l">قيد المراجعة</div></div>

// قائمة تواريخ الغياب المختارة
let excuseDates=[];
function addExcuseDate(){
  const inp=document.getElementById('rq-date');
  const dt=inp.value;
  if(!dt){showToast('اختر تاريخ أولاً','w');return;}
  if(excuseDates.includes(dt)){showToast('هذا اليوم مضاف مسبقاً','w');return;}
  const day=dateToArDay(dt);
  if(day==='الجمعة'||day==='السبت'){showToast('عطلة نهاية الأسبوع — اختر يوم دراسي','w');return;}
  excuseDates.push(dt);
  excuseDates.sort();
  inp.value='';
  renderExcuseDates();
}
function removeExcuseDate(dt){
  excuseDates=excuseDates.filter(d=>d!==dt);
  renderExcuseDates();
}
function renderExcuseDates(){
  const list=document.getElementById('rq-dates-list');
  const totalDiv=document.getElementById('rq-dates-total');
  if(!list)return;
  if(!excuseDates.length){
    list.innerHTML='<div style="font-size:12px;color:var(--muted)">لم تضف أيام غياب بعد</div>';
    if(totalDiv)totalDiv.innerHTML='';
    return;
  }
  // المادة المختارة لحساب الحصص
  const sel=document.getElementById('rq-course');
  const course=sel?sel.value:'';
  const grp=user.grp;
  list.innerHTML=excuseDates.map(dt=>{
    const day=dateToArDay(dt);
    const sessions=course?courseSessionsOnDay(course,grp,day):0;
    const perHour=schedConfig.periodHours||2;
    const hrs=sessions*perHour;
    const info=course?(sessions>0?`${sessions} حصة · ${hrs} ساعة`:'لا حصص لهذه المادة بهذا اليوم'):'اختر المادة أولاً';
    return `<div style="display:flex;justify-content:space-between;align-items:center;background:var(--card2);padding:8px 12px;border-radius:6px;border:1px solid var(--border)">
      <div><span style="font-weight:700">${day}</span> <span style="color:var(--muted);font-size:12px">${dt}</span> <span style="font-size:11px;color:#6ab8f7;margin-right:8px">${info}</span></div>
      <button type="button" onclick="removeExcuseDate('${dt}')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:16px">✕</button>
    </div>`;
  }).join('');
  if(totalDiv&&course){
    const {totalHrs}=excuseHoursFromDates(course,grp,excuseDates);
    totalDiv.innerHTML=`📊 الإجمالي: <strong style="color:#6ab8f7">${excuseDates.length} يوم · ${totalHrs} ساعة غياب</strong> (تُخصم تلقائياً عند الاعتماد)`;
  }
}

/* ============================================================
   نظام مسارات الموافقات متعدد المستويات
   - عذر غياب : المدرب ← مشرف التخصص ← مدير الأكاديمية (المشرف العام)
   - طلب إداري: مشرف التخصص ← مدير الأكاديمية
   - ورقة تعريف: مشرف التخصص ← مدير الأكاديمية
   - طلب عام  : المُرسِل يحدد الشخص → له الاعتماد/الرفض/الإرجاع أو التصعيد للمدير
   كل مرحلة: اعتماد · رفض نهائي · إرجاع لصاحب الطلب للتعديل
   ============================================================ */
const REQ_CATS={
  'عذر':  {label:'عذر غياب',   icon:'📄', chain:['trn','sup','dir']},
  'إداري':{label:'طلب إداري',  icon:'🏛️', chain:['sup','dir']},
  'تعريف':{label:'ورقة تعريف', icon:'📇', chain:['sup','dir']},
  'عام':  {label:'طلب عام',    icon:'✉️', chain:['tgt']}
};
const STAGE_LBL={trn:'المدرب',sup:'مشرف التخصص',gen:'مشرف التخصص',dir:'مدير الأكاديمية',tgt:'المسؤول المحدد'};
function reqCat(r){
  if(r.cat&&REQ_CATS[r.cat])return r.cat;
  if(r.type==='عذر غياب')return 'عذر';
  if((r.type||'').includes('تعريف'))return 'تعريف';
  if((r.type||'').includes('عام'))return 'عام';
  return 'إداري';
}
function reqChain(r){
  const ch=REQ_CATS[reqCat(r)].chain.slice();
  if(reqCat(r)==='عام'&&r.dirStatus&&r.dirStatus!=='—'&&r.dirStatus!=='')ch.push('dir');
  return ch;
}
function reqChainLast(r){const ch=reqChain(r);return ch[ch.length-1];}
const _STMAP={trn:'trnStatus',sup:'supStatus',gen:'genStatus',dir:'dirStatus',tgt:'tgtStatus'};
function stageStatus(r,st){return (r[_STMAP[st]]||'معلق');}
function setStage(r,st,v){r[_STMAP[st]]=v;}
function setStageObj(o,st,v){o[_STMAP[st]]=v;}
function reqFinal(r){
  const ss=reqChain(r).map(s=>stageStatus(r,s));
  if(ss.indexOf('مرفوض')>-1)return 'مرفوض';
  if(ss.indexOf('معاد')>-1)return 'بانتظار التعديل';
  if(ss.length&&ss.every(x=>x==='معتمد'))return 'معتمد';
  return 'قيد المراجعة';
}
function reqActiveStage(r){
  const ch=reqChain(r);
  for(let i=0;i<ch.length;i++){
    const s=stageStatus(r,ch[i]);
    if(s==='معتمد')continue;
    if(s==='معلق'){for(let j=0;j<i;j++)if(stageStatus(r,ch[j])!=='معتمد')return null;return ch[i];}
    return null; // مرفوض أو معاد → لا مرحلة نشطة
  }
  return null;
}
function isDirector(u){return !!u&&u.role==='a'&&u.level==='director';} // المدير (لقبه «المشرف العام») يشوف الكل ويعتمد نهائياً
function isSpecSup(u){return !!u&&u.role==='a'&&u.level!=='director';} // مشرف تخصص — لكل مشرف تخصصه
function isGenSup(u){return isDirector(u);} // لا يوجد مشرف عام مستقل — المدير هو من يشرف على الكل
// تخصصات المشرف قد تكون أكثر من واحد (مفصولة بفاصلة). هل تشمل تخصص الطلب؟
function specListOf(v){return String(v||'').split(/[،,]/).map(x=>x.trim()).filter(Boolean);}
function specCovers(uSpec,rSpec){
  rSpec=String(rSpec||'').trim();
  const list=specListOf(uSpec);
  if(!list.length)return true;                 // مشرف بدون تخصص محدد → يرى الكل
  if(list.indexOf('جميع الدبلومات')>-1)return true;
  if(!rSpec)return true;
  return list.indexOf(rSpec)>-1;
}
// عرض تخصصات المشرف كوسوم
function specListHtml(v){
  const list=specListOf(v);
  if(list.indexOf('جميع الدبلومات')>-1)return '<span class="pill pg">جميع التخصصات</span>';
  if(!list.length)return '<span class="pill pb">غير محدد</span>';
  return list.map(x=>`<span class="pill pg" style="margin:1px">${esc(x)}</span>`).join(' ');
}
function trainerOwnsReqCourse(r){
  const cn=((r.details||'').match(/المادة:\s*([^|]+)/)||[])[1];
  if(!cn)return true;
  return [...new Set((students||[]).map(s=>s.course))].includes(cn.trim());
}
function reqTargetMatches(r,u){
  const tr=r.targetRole;
  if(tr==='dir'||tr==='gen')return isDirector(u);
  if(tr==='spec')return u.role==='a'&&u.level!=='director'&&specCovers(u.spec,r.reqSpec);
  if(tr==='t')return u.role==='t'&&_nk(r.targetName)===_nk(u.name);
  if(tr==='a')return u.role==='a'&&((r.targetId&&String(r.targetId)===String(u.id))||_nk(r.targetName)===_nk(u.name));
  return false;
}
function canActStage(st,r){
  const u=user;if(!u)return false;
  if(st==='trn')return u.role==='t'&&trainerOwnsReqCourse(r);
  if(st==='sup'||st==='gen')return u.role==='a'&&(isDirector(u)||specCovers(u.spec,r.reqSpec)); // مشرف التخصص المطابق (والمدير احتياطاً/إشرافاً)
  if(st==='dir')return isDirector(u);
  if(st==='tgt')return reqTargetMatches(r,u);
  return false;
}
function reqStatusPill(r){
  const f=reqFinal(r);
  if(f==='معتمد')return '<span class="pill pg">معتمد نهائياً ✓</span>';
  if(f==='مرفوض')return '<span class="pill pr">مرفوض</span>';
  if(f==='بانتظار التعديل')return '<span class="pill py">بانتظار تعديل صاحب الطلب</span>';
  const st=reqActiveStage(r);
  return '<span class="pill pb">بانتظار '+(STAGE_LBL[st]||'المراجعة')+'</span>';
}
function reqTimeline(r){
  const ch=reqChain(r),act=reqActiveStage(r);
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+ch.map(s=>{
    const v=stageStatus(r,s),on=act===s;
    const col=v==='معتمد'?'var(--green)':v==='مرفوض'?'var(--red)':v==='معاد'?'var(--gold)':on?'#6ab8f7':'var(--muted)';
    const ic=v==='معتمد'?'✓':v==='مرفوض'?'✕':v==='معاد'?'↩':on?'⏳':'•';
    return '<span style="font-size:11px;color:'+col+';border:1px solid '+col+';border-radius:12px;padding:2px 9px;'+(on?'font-weight:700;background:rgba(106,184,247,.08);':'')+'">'+ic+' '+STAGE_LBL[s]+'</span>';
  }).join('')+'</div>';
}
function staffList(){
  const me=user;
  const admins=(typeof adminsDB!=='undefined'&&adminsDB.length)?adminsDB:[];
  const trs=(typeof trainersDB!=='undefined'&&trainersDB.length)?trainersDB:[];
  const isMgr=a=>a.level&&String(a.level).includes('مدير');
  const arr=[];
  if(me.role==='s'){
    // مدربو الترم الحالي فقط — بالاسم وصفته
    [...new Set((courses||[]).filter(c=>isActive(c.status)).map(c=>c.trainer).filter(Boolean))].forEach(nm=>{
      const t=trs.find(x=>_nk(x.name)===_nk(nm));
      arr.push({name:nm,role:'t',id:t?t.id:'',sub:'مدرب'});
    });
    // مشرف تخصص الطالب — بالاسم
    admins.filter(a=>!isMgr(a)&&specCovers(a.spec,me.spec)).forEach(a=>arr.push({name:a.name,role:'a',id:a.id,sub:'مشرف التخصص'}));
    // مدير الأكاديمية — بالاسم
    admins.filter(isMgr).forEach(a=>arr.push({name:a.name,role:'a',id:a.id,sub:'مدير الأكاديمية'}));
    // احتياط لو لم تتوفّر أسماء الإداريين
    if(!admins.length){
      arr.push({name:'مشرف التخصص',role:'spec',id:'',sub:'مشرف التخصص'});
      arr.push({name:'مدير الأكاديمية',role:'dir',id:'',sub:'مدير الأكاديمية'});
    }
  }else{
    admins.forEach(a=>arr.push({name:a.name,role:'a',id:a.id,sub:isMgr(a)?'مدير الأكاديمية':'مشرف التخصص'}));
    trs.forEach(t=>arr.push({name:t.name,role:'t',id:t.id,sub:'مدرب'}));
  }
  return arr.filter(p=>!p.id||String(p.id)!==String(me.id));
}
function reqExcuseParse(r){
  const d=r.details||'';
  return {course:((d.match(/المادة:\s*([^|]+)/)||[])[1]||'').trim(),
    days:((d.match(/الأيام:\s*([^|]+)/)||[])[1]||'').trim(),
    hours:((d.match(/ساعات:\s*([\d.]+)/)||[])[1]||'0'),
    reason:((d.match(/السبب:\s*([^|]+)/)||[])[1]||'').trim(),
    file:((d.match(/الملف:\s*(\S+)/)||[])[1]||'').trim()};
}

async function submitRequest(){
  const typeSel=document.getElementById('rq-type');
  if(!typeSel)return;
  const type=typeSel.value;
  const cat=({'عذر غياب':'عذر','ورقة تعريف':'تعريف','طلب إداري':'إداري','طلب عام':'عام'})[type]||'إداري';
  let details=(document.getElementById('rq-details')?document.getElementById('rq-details').value:'').trim();
  let exCode='',exHours='',exDates='',fileData='',fileName='';
  let targetName='',targetRole='',targetId='';
  const raiser=user;
  const reqSpec=raiser.spec||'';
  if(cat==='عذر'){
    const sel=document.getElementById('rq-course');
    const exCourse=sel?sel.value:'';
    exCode=(sel&&sel.options[sel.selectedIndex])?sel.options[sel.selectedIndex].dataset.code||'':'';
    if(!exCourse){showToast('اختر المادة','w');return}
    if(!excuseDates.length){showToast('أضف يوم غياب واحد على الأقل','w');return}
    const {totalHrs,breakdown}=excuseHoursFromDates(exCourse,user.grp,excuseDates);
    if(totalHrs<=0){showToast('المادة ما عندها حصص في الأيام المختارة — تأكد من الجدول','w');return}
    exHours=totalHrs; exDates=excuseDates.join(', ');
    const daysDesc=breakdown.map(b=>`${b.day} (${b.date})`).join(' · ');
    const fileInput=document.getElementById('rq-file');
    if(fileInput&&fileInput.files&&fileInput.files[0]){
      const f=fileInput.files[0];
      if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')){showToast('الملف لازم يكون PDF','w');return}
      if(f.size>5*1024*1024){showToast('حجم الملف كبير (الحد 5 ميجا)','w');return}
      fileName=f.name; showToast('جاري قراءة الملف...','i');
      fileData=await new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]||'');rd.onerror=()=>rej();rd.readAsDataURL(f);}).catch(()=>'');
    }
    details=`[عذر غياب] المادة: ${exCourse} | الأيام: ${daysDesc} | ساعات: ${exHours} | السبب: ${details||'—'}`;
  }
  if(cat==='عام'){
    const tsel=document.getElementById('rq-target');
    if(!tsel||!tsel.value){showToast('اختر الشخص اللي تبغى ترسل له','w');return}
    const opt=tsel.options[tsel.selectedIndex];
    targetRole=opt.dataset.role||''; targetId=opt.dataset.id||''; targetName=opt.value;
  }
  if(!details){showToast('يرجى كتابة تفاصيل الطلب','w');return}
  const rid='REQ'+Date.now();
  const now=new Date().toLocaleDateString('en-CA');
  const st={trnStatus:'—',supStatus:'—',genStatus:'—',dirStatus:'—',tgtStatus:'—'};
  REQ_CATS[cat].chain.forEach(s=>setStageObj(st,s,'معلق'));
  // تخطّي المراحل التي هي بمستوى المُرسِل أو أدنى (لغير الطلبات العامة)
  if(cat!=='عام'&&raiser.role==='a'){ st.supStatus='معتمد'; } // المشرف نفسه صاحب الطلب → يبدأ من المدير
  const rec={rid,sid:raiser.id,sname:raiser.name,grp:raiser.grp||'',type,details,date:now,
    supStatus:st.supStatus,genStatus:st.genStatus,dirStatus:st.dirStatus,trnStatus:st.trnStatus,tgtStatus:st.tgtStatus,
    finalStatus:'قيد المراجعة',notes:'',exCode,exHours,exDates,fileData,fileName,
    cat,reqRole:raiser.role,reqSpec,targetName,targetRole,targetId};
  rec.finalStatus=reqFinal(rec);
  showToast('جاري إرسال الطلب...','i');
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({token:SESSION.token,action:'addRequest',records:[rec]}),headers:{'Content-Type':'text/plain'}});
    showToast('✅ تم إرسال طلبك بنجاح','s');
    delete rec.fileData;
    requests.unshift(rec);
    if(document.getElementById('rq-details'))document.getElementById('rq-details').value='';
    excuseDates=[];
    reloadRequestsPage();
  }catch(e){showToast('تعذر الإرسال — جرب مرة أخرى','e');}
}

async function resubmitRequest(rid){

  ['trn','sup','gen','dir','tgt'].forEach(s=>setStage(r,s,'—'));
  REQ_CATS[reqCat(r)].chain.forEach(s=>setStage(r,s,'معلق'));
  r.notes='أعاد صاحب الطلب الإرسال بعد التعديل';
  r.finalStatus=reqFinal(r);
  const payload={rid,trnStatus:r.trnStatus,supStatus:r.supStatus,genStatus:r.genStatus,dirStatus:r.dirStatus,tgtStatus:r.tgtStatus,finalStatus:r.finalStatus,notes:r.notes,details:r.details,by:user.name};
  showToast('جاري إعادة الإرسال...','i');

// اتخاذ إجراء على طلب في مرحلته النشطة: اعتماد | رفض | معاد (إرجاع) | تصعيد (للطلب العام)
async function actOnRequest(rid,decision){
  const r=requests.find(x=>x.rid===rid);
  if(!r)return;
  const st=reqActiveStage(r);
  if(!st||!canActStage(st,r)){showToast('لا يمكنك اتخاذ إجراء على هذا الطلب الآن','w');return}
  let reason='';
  if(decision==='مرفوض')reason=(prompt('سبب الرفض (اختياري):')||'').trim();
  else if(decision==='معاد')reason=(prompt('وش المطلوب تعديله؟ (يظهر لصاحب الطلب):')||'').trim();
  if(decision==='تصعيد'){
    if(st!=='tgt'){showToast('التصعيد متاح للطلبات العامة فقط','w');return}
    setStage(r,'tgt','معتمد'); r.dirStatus='معلق';
    r.notes='صعّده '+user.name+' لمدير الأكاديمية';
  }else{
    setStage(r,st,decision);
    if(decision==='مرفوض')r.notes='رفضه '+STAGE_LBL[st]+' ('+user.name+')'+(reason?' — '+reason:'');
    else if(decision==='معاد')r.notes='أرجعه '+STAGE_LBL[st]+' ('+user.name+') للتعديل'+(reason?' — '+reason:'');
    else r.notes='اعتمده '+STAGE_LBL[st]+' ('+user.name+')';
  }
  r.finalStatus=reqFinal(r);
  // ===== خصم ساعات العذر عند الاعتماد النهائي فقط =====
  let excuseInfo=null;
  if(reqCat(r)==='عذر'&&decision==='معتمد'&&r.finalStatus==='معتمد'){
    let code=r.exCode||'', hrs=parseFloat(r.exHours)||0;
    if(!hrs){const m=(r.details||'').match(/ساعات:\s*([\d.]+)/);if(m)hrs=parseFloat(m[1])||0;}
    if(!code){
      const m=(r.details||'').match(/المادة:\s*([^|]+)/);
      if(m){const cn=m[1].trim();const cc=allCourses.find(x=>x.sid===r.sid&&x.course===cn);if(cc)code=normCode(cc.code);}
    }
    const rowC=allCourses.find(x=>x.sid===r.sid&&normCode(x.code)===normCode(code));
    if(rowC&&hrs>0){
      const excusedPct=absHoursToPct(hrs,code);
      const newAbs=Math.max(0,Math.round((rowC.abs-excusedPct)*10)/10);
      rowC.abs=newAbs;
      excuseInfo={key:rowC.key,sid:r.sid,absence:newAbs};
    }
  }
  const payload={rid,trnStatus:r.trnStatus,supStatus:r.supStatus,genStatus:r.genStatus,dirStatus:r.dirStatus,tgtStatus:r.tgtStatus,finalStatus:r.finalStatus,notes:r.notes,by:user.name};
  showToast('جاري الحفظ...','i');
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({token:SESSION.token,action:'updateRequest',records:[payload]}),headers:{'Content-Type':'text/plain'}});
    if(excuseInfo){
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({token:SESSION.token,action:'saveAttendance',records:[excuseInfo]}),headers:{'Content-Type':'text/plain'}});
      showToast('✅ تم الاعتماد وخصم ساعات الغياب','s');
    }else{
      showToast(decision==='مرفوض'?'تم الرفض':decision==='معاد'?'تم الإرجاع للتعديل':decision==='تصعيد'?'✅ تم التصعيد للمدير':'✅ تم الاعتماد','s');
    }
    reloadRequestsPage();
  }catch(e){showToast('تعذر الحفظ — جرب مرة أخرى','e');}
}
function toggleTheme(){
  const body = document.body;
  const isLight = body.classList.contains('light-mode');
  if(isLight){
    body.classList.remove('light-mode');
    localStorage.setItem('bla_theme','dark');
    document.querySelectorAll('#themeBtn,#themeBtnLogin').forEach(b=>{if(b){b.innerHTML='🌙';b.title='الوضع الفاتح';}});
  } else {
    body.classList.add('light-mode');
    localStorage.setItem('bla_theme','light');
    document.querySelectorAll('#themeBtn,#themeBtnLogin').forEach(b=>{if(b){b.innerHTML='☀️';b.title='الوضع الداكن';}});
  }
}

// استرجاع الثيم
(function(){
  const saved = localStorage.getItem('bla_theme');
  if(saved === 'light'){
    document.body.classList.add('light-mode');
    document.addEventListener('DOMContentLoaded',()=>{
      document.querySelectorAll('#themeBtn,#themeBtnLogin').forEach(b=>{if(b)b.innerHTML='☀️';});
    });
  }
})();


// ===== GROUP DETAIL MODAL =====
function showGroupDetail(grp){
  const gs = students.filter(s=>s.grp===grp);
  const gc = allCourses.filter(c=>gs.some(s=>s.id===c.sid));
  const ga = avgPct(gc);
  
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='groupModal';
  overlay.innerHTML=`
    <div class="modal" style="max-width:620px;max-height:85vh;overflow-y:auto">
      <div class="modal-title">
        <div>
          <div style="font-size:16px;font-weight:700">📋 الشعبة ${grp}</div>
          <div style="font-size:12px;color:var(--muted);font-weight:400">${gs.length} متدرب · متوسط ${ga}%</div>
        </div>
        <button class="modal-close" onclick="document.getElementById('groupModal').remove()">✕</button>
      </div>
      <div class="gtable">
        <table>
          <thead><tr><th>الرقم</th><th>الاسم</th><th>التخصص</th><th>الجوال</th></tr></thead>
          <tbody>${gs.map(s=>`<tr onclick="document.getElementById('groupModal').remove();setTimeout(()=>showStudentDetail('${esc(s.id.toString())}'),100)" style="cursor:pointer">
            <td style="color:var(--muted)">${esc(s.id.toString())}</td><td>${esc(s.name)}</td>
            <td style="color:var(--muted);font-size:12px">${esc(s.spec||'—')}</td>
            <td style="color:var(--muted)">${esc(s.ph||'—')}</td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click',e=>{ if(e.target===overlay) overlay.remove(); });
}

// ربط البطاقات بالتنقل
document.addEventListener('click', function(e){
  const card = e.target.closest('[data-nav]');
  if(card){
    const target = card.dataset.nav;
    if(target === 'trainers'){
      // عرض المدربين كنافذة
      const trainerNames = [...new Set(allCourses.map(c=>c.trainer).filter(Boolean))];
      const overlay=document.createElement('div');
      overlay.className='modal-overlay';
      overlay.id='trainersModal';
      overlay.innerHTML=`<div class="modal" style="max-width:500px">
        <div class="modal-title"><div>👨‍🏫 المدربون (${trainerNames.length})</div>
        <button class="modal-close" onclick="document.getElementById('trainersModal').remove()">✕</button></div>
        ${trainerNames.map(t=>{
          const tc=allCourses.filter(c=>c.trainer===t);
          const ta=avgPct(tc);
          return `<div class="iitem" style="margin-bottom:8px"><div class="ilbl">${t}</div><div class="ival">${tc.length} مقرر · متوسط ${ta}%</div></div>`;
        }).join('')}
      </div>`;
      document.body.appendChild(overlay);
      overlay.addEventListener('click',ev=>{ if(ev.target===overlay) overlay.remove(); });
    } else {
      showAPage(target, document.querySelector(`.sitem[onclick*="${target}"]`));
    }
  }
});

let currentLang = 'ar';

function txText(txt){
  const t=TRANSLATIONS[currentLang]||{};
  if(t[txt]!==undefined)return t[txt];
  if(currentLang==='en'){
    for(const [re,rep] of EN_PATTERNS){const m=txt.match(re);if(m)return txt.replace(re,rep);}
  }
  return null;
}
// سجلّ الأصول العربية للاسترجاع الكامل عند العودة للعربية
let _txNodes=[];   // {node, orig}
let _txAttrs=[];   // {el, attr, orig}
/* ===== ترجمة آلية تلقائية: أي نص عربي لا يغطّيه القاموس يُترجم عبر خدمة ترجمة ويُخزّن ===== */
const MT_CACHE={};
try{Object.assign(MT_CACHE,JSON.parse(localStorage.getItem('bla_mt_cache')||'{}'));}catch(e){}
let _mtSaveT=null;
function mtSave(){ if(_mtSaveT)return; _mtSaveT=setTimeout(()=>{_mtSaveT=null;try{localStorage.setItem('bla_mt_cache',JSON.stringify(MT_CACHE));}catch(e){}},1200); }
function isArabicText(s){ return /[؀-ۿ]/.test(s); }
async function mtFetch(text){
  if(MT_CACHE[text]!==undefined)return MT_CACHE[text];
  // 1) Google (gtx) — جودة أعلى
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=en&dt=t&q='+encodeURIComponent(text));
    if(r.ok){const j=await r.json();const out=((j&&j[0])||[]).map(s=>(s&&s[0])||'').join('').trim();if(out){MT_CACHE[text]=out;mtSave();return out;}}
  }catch(e){}
  // 2) MyMemory — احتياطي يدعم CORS
  try{
    const r2=await fetch('https://api.mymemory.translated.net/get?langpair=ar|en&q='+encodeURIComponent(text));
    if(r2.ok){const j2=await r2.json();const out=j2&&j2.responseData&&String(j2.responseData.translatedText||'').trim();if(out&&!/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(out)){MT_CACHE[text]=out;mtSave();return out;}}
  }catch(e){}
  return null;
}
const _mtQueue=new Map();   // نص -> [عُقد]
const _mtAttrQueue=[];      // {el,attr,txt}
let _mtTimer=null,_mtRunning=false;
function mtQueueNode(node,txt){
  if(node._txOrig===undefined){node._txOrig=node.textContent;_txNodes.push(node);}
  if(!_mtQueue.has(txt))_mtQueue.set(txt,[]);
  _mtQueue.get(txt).push(node); mtSchedule();
}
function mtQueueAttr(el,attr,txt){
  if(!el['_txOrig_'+attr]){el['_txOrig_'+attr]=el.getAttribute(attr);_txAttrs.push({el,attr});}
  _mtAttrQueue.push({el,attr,txt}); mtSchedule();
}
function mtSchedule(){ if(_mtTimer||_mtRunning)return; _mtTimer=setTimeout(mtProcess,250); }
async function mtProcess(){
  _mtTimer=null; if(_mtRunning)return; _mtRunning=true;
  try{
    const items=[..._mtQueue.entries()]; _mtQueue.clear();
    const attrs=_mtAttrQueue.splice(0);
    for(const [txt,nodes] of items){
      if(currentLang!=='en')break;
      const en=await mtFetch(txt);
      if(en)nodes.forEach(nd=>{try{if(nd._txOrig!==undefined)nd.textContent=nd._txOrig.replace(txt,en);}catch(e){}});
    }
    for(const it of attrs){
      if(currentLang!=='en')break;
      const en=await mtFetch(it.txt);
      if(en){try{it.el.setAttribute(it.attr,en);}catch(e){}}
    }
  }finally{
    _mtRunning=false;
    if(_mtQueue.size||_mtAttrQueue.length)mtSchedule();
  }
}
function handleTextNode(node){
  const raw=node.textContent;const txt=raw.trim();
  if(!txt)return;
  const tr=txText(txt);
  if(tr!==null){ if(node._txOrig===undefined){node._txOrig=raw;_txNodes.push(node);} node.textContent=raw.replace(txt,tr); return; }
  if(currentLang==='en'&&isArabicText(txt)){
    const c=MT_CACHE[txt];
    if(c!==undefined){ if(node._txOrig===undefined){node._txOrig=raw;_txNodes.push(node);} node.textContent=raw.replace(txt,c); } // مخزّن → فوري (لا يرجع عربي)
    else mtQueueNode(node,txt); // جديد → يُترجم مرة ويُخزّن
  }
}
function translateNode(root){
  if(currentLang!=='en')return;
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  let n;const nodes=[];
  while(n=walker.nextNode())nodes.push(n);
  nodes.forEach(handleTextNode);
  (root.querySelectorAll?[...root.querySelectorAll('[placeholder],[title]')]:[]).forEach(el=>{
    ['placeholder','title'].forEach(a=>{
      const v=el.getAttribute&&el.getAttribute(a);
      if(v){const t=v.trim();const tr=txText(t);
        if(tr!==null){
          if(!el['_txOrig_'+a]){el['_txOrig_'+a]=v;_txAttrs.push({el,attr:a});}
          el.setAttribute(a,tr);
        } else if(currentLang==='en'&&isArabicText(t)){
          const c=MT_CACHE[t];
          if(c!==undefined){ if(!el['_txOrig_'+a]){el['_txOrig_'+a]=v;_txAttrs.push({el,attr:a});} el.setAttribute(a,c); }
          else mtQueueAttr(el,a,t);
        }
      }
    });
  });
}
function restoreArabic(){
  _txNodes.forEach(node=>{try{if(node._txOrig!==undefined){node.textContent=node._txOrig;delete node._txOrig;}}catch(e){}});
  _txAttrs.forEach(({el,attr})=>{try{const o=el['_txOrig_'+attr];if(o){el.setAttribute(attr,o);delete el['_txOrig_'+attr];}}catch(e){}});
  _txNodes=[];_txAttrs=[];
}
let _txObserver=null;
function startTxObserver(){
  if(_txObserver)return;
  _txObserver=new MutationObserver(muts=>{
    if(currentLang!=='en')return;
    muts.forEach(m=>{
      m.addedNodes.forEach(nd=>{
        if(nd.nodeType===1)translateNode(nd);
        else if(nd.nodeType===3)handleTextNode(nd);
      });
    });
  });
  _txObserver.observe(document.body,{childList:true,subtree:true});
}
function translateTo(lang){
  currentLang = lang;
  document.documentElement.dir = lang==='en' ? 'ltr' : 'rtl';
  document.documentElement.lang = lang;
  document.body.classList.toggle('lang-en', lang==='en');
  localStorage.setItem('bla_lang', lang);
  const menu=document.getElementById('txMenu');if(menu)menu.style.display='none';
  const btn=document.getElementById('txBtn');
  if(btn){btn.innerHTML = lang==='en' ? '🇸🇦' : '🌐';btn.style.background='rgba(13,29,48,0.95)';btn.style.borderColor='rgba(100,160,220,0.25)';}
  if(lang==='en'){
    startTxObserver();
    translateNode(document.body);
  }else{
    // ⭐ العودة للعربية: استرجاع كل النصوص الأصلية المحفوظة
    restoreArabic();
    try{if(typeof user !== 'undefined' && user && typeof showApp === 'function') showApp();}catch(e){}
  }
}

document.addEventListener('DOMContentLoaded',()=>{
  const savedLang = localStorage.getItem('bla_lang');
  if(savedLang==='en') setTimeout(()=>translateTo('en'), 500);
});

function toggleTx(){
  const m=document.getElementById('txMenu');
  const b=document.getElementById('txBtn');
  if(m.style.display==='none'||!m.style.display){
    m.style.display='block';
    b.style.background='rgba(26,122,191,0.3)';
    b.innerHTML='✕';
  }else{
    m.style.display='none';
    b.style.background='rgba(13,29,48,0.95)';
    b.innerHTML= currentLang==='en'?'🇸🇦':'🌐';
  }
}
document.addEventListener('click',function(e){
  const w=document.getElementById('txWidget');
  if(w&&!w.contains(e.target)){
    document.getElementById('txMenu').style.display='none';
    const b=document.getElementById('txBtn');
    if(b) b.innerHTML=currentLang==='en'?'🇸🇦':'🌐';
  }
});
