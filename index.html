// ===== UTILS =====
function pillClass(p){return p>=80?'pg':p>=60?'py':'pr'}
function fillClass(p){return p>=80?'pf-g':p>=60?'pf-y':'pf-r'}
function ccClass(p){return p>=80?'cc-g':p>=60?'cc-y':'cc-r'}
// ===== منطق المشاكل الفعلية =====
// أداء منخفض: فقط للمواد التي اترصدت درجتها (>0) وليست حالية (لسه ما خلصت)
function isLowPerf(c){return !isActive(c.status) && c.pct>0 && c.pct<60}
// ===== رصد الرسوب (متطلبات) =====
// راسب = درجة أقل من 60 (ومرصودة) أو الحرفي راسب (F/هـ/راسب/محروم)
function isFailed(c){
  const g=parseFloat(c.pct)||0;
  const L=String(c.letter||'').replace(/\s+/g,'').trim();
  const failLetters=['F','f','هـ','ه','راسب','محروم','ر'];
  const letterFail=failLetters.some(x=>L===x||L.includes('راسب')||L.includes('محروم'));
  // نعتبره راسباً لو الدرجة مرصودة (>0) وأقل من 60، أو الحرفي راسب
  return (g>0&&g<60)||letterFail;
}
// ===== مستويات الإنذار للغياب =====
// 10% إنذار أول | 20% إنذار ثاني | 25% محروم
function absLevel(abs){
  abs=parseFloat(abs)||0;
  if(abs>=25)return {key:'deprived',label:'محروم',color:'var(--red)',pill:'pr'};
  if(abs>=20)return {key:'warn2',label:'إنذار ثاني',color:'#ff8a3c',pill:'pr'};
  if(abs>=10)return {key:'warn1',label:'إنذار أول',color:'#f4c78a',pill:'py'};
  return {key:'ok',label:'منتظم',color:'var(--green)',pill:'pg'};
}
function isDeprived(abs){return (parseFloat(abs)||0)>=25}
// غياب عالي للاشعارات: من الإنذار الأول (10%) فأكثر
function isHighAbs(c){return (parseFloat(c.abs)||0)>=10}
// مشكلة عامة (للعدّ والتلوين)
function hasIssue(c){return isHighAbs(c)||isLowPerf(c)}
// ===== حساب ساعات المادة في النصف المجزأ =====
// ساعات الاتصال أسبوعية × 8 أسابيع = إجمالي ساعات النصف المجزأ
const WEEKS_PER_HALF=8;
// كشف التدريب التعاوني (حالة خاصة: ساعات إجمالية مباشرة + خارج الجدول الأسبوعي)
function isCoopTraining(code){
  const cat=catalog.find(c=>normCode(c.code)===normCode(code));
  const name=cat?cat.name:'';
  return /تدريب\s*تعاوني|التعاوني/.test(name);
}
function courseTotalHours(code){
  const cat=catalog.find(c=>normCode(c.code)===normCode(code));
  const hours=cat?parseFloat(cat.hours)||0:0;
  // التدريب التعاوني: الرقم إجمالي مباشر (تدريب ميداني فصل كامل)
  if(isCoopTraining(code))return hours;
  // باقي المواد: ساعات أسبوعية × عدد الأسابيع
  return hours*WEEKS_PER_HALF;
}
// نسبة الغياب = (ساعات الغياب ÷ إجمالي ساعات المادة) × 100
function absHoursToPct(absHours,code){
  const total=courseTotalHours(code);
  if(!total)return 0;
  return Math.min(Math.round((absHours/total)*1000)/10,100); // خانة عشرية واحدة
}
// تحويل تاريخ (YYYY-MM-DD) إلى اسم اليوم بالعربي
function dateToArDay(dateStr){
  try{
    const d=new Date(dateStr+'T00:00:00');
    const map=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    return map[d.getDay()];
  }catch(e){return '';}
}
// عدد حصص مادة معيّنة في يوم أسبوع معيّن (من الجدول المحفوظ، عبر كل الشعب التي يدرسها الطالب)
function courseSessionsOnDay(course,grp,day){
  let count=0;
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  const countIn=(g)=>{let n=0;if(g)for(const slot in g){const [d]=slot.split('|');if(d===day&&nrm(g[slot].course)===nrm(course))n++;}return n;};
  count=countIn(schedule[grp]);
  if(count===0){for(const gg in schedule){if(gg===grp)continue;const n=countIn(schedule[gg]);if(n){count=n;break;}}}
  return count;
}

// ===== نظام الغياب الجديد (بالأيام · مربوط بالجدول) =====
// كم يوم بالأسبوع فيه حصص لهذه المادة (يبحث في الشعبة المحددة، وإن لم يجد ففي كل الشعب)
function courseDaysPerWeek(course,grp){
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  const target=nrm(course);
  // دالة مساعدة: تجمع أيام المادة في شعبة معيّنة
  const daysInGrp=(g)=>{
    const set=new Set();
    if(g)for(const slot in g){const [d]=slot.split('|');if(nrm(g[slot].course)===target)set.add(d);}
    return set;
  };
  // أولاً: ابحث في الشعبة المحددة
  let daysSet=daysInGrp(schedule[grp]);
  // إن لم نجد في الشعبة المحددة، ابحث في كل الشعب (قد يكون grp مختلفاً)
  if(daysSet.size===0){
    for(const g in schedule){
      const s=daysInGrp(schedule[g]);
      if(s.size>0){daysSet=s;break;}
    }
  }
  return daysSet.size;
}
// إجمالي أيام المادة في الترم = أيام الأسبوع × عدد الأسابيع (افتراضي 8)
function courseTotalDays(course,grp){
  const dpw=courseDaysPerWeek(course,grp);
  return dpw*(typeof WEEKS_PER_HALF!=='undefined'?WEEKS_PER_HALF:8);
}
// تحويل أيام الغياب إلى نسبة مئوية (غياب يوم=1 · متأخر=0.5)
function absDaysToPct(absDays,course,grp){
  const total=courseTotalDays(course,grp);
  if(!total)return 0;
  return Math.min(Math.round(absDays/total*1000)/10,100);
}
// تحويل النسبة المئوية إلى أيام غياب (للعرض/التعديل)
function pctToAbsDays(pct,course,grp){
  const total=courseTotalDays(course,grp);
  return Math.round(pct/100*total*2)/2; // تقريب لأقرب نص يوم
}
// ما هي مواد اليوم (حسب الجدول) لمدرب معيّن — تُرجع المواد التي لها حصة اليوم
function todayCoursesForTrainer(trainerName,dayName){
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  const found=new Map(); // course → {course, grps:Set}
  for(const grp in schedule){
    const g=schedule[grp];
    for(const slot in g){
      const [d]=slot.split('|');
      if(d===dayName && nrm(g[slot].trainer)===nrm(trainerName)){
        const c=g[slot].course;
        if(!found.has(c))found.set(c,{course:c,code:g[slot].code,grps:new Set()});
        found.get(c).grps.add(grp);
      }
    }
  }
  return [...found.values()];
}

// ===== المصدر الوحيد للحقيقة: حساب نسب الغياب من تبويب "قاعدة الغياب" =====
// خريطة عامة: مفتاح "sidDigits|codeDigits" → مجموع أيام الغياب
let absenceDaysMap={};        // مفتاح بالرمز: "sid|codeDigits|grp|term" (للسجلات التي فيها رمز)
let absenceDaysMapByName={};  // مفتاح بالاسم: "sid|nameKey|grp|term" (للسجلات القديمة بلا رمز)
let absenceRows=[];           // الصفوف الخام لتبويب "قاعدة الغياب" (لصفحة سجل التحضير)
const cnk_=c=>String(c||'').replace(/\s+/g,'').trim(); // توحيد اسم المادة (إزالة المسافات)
// تحميل "قاعدة الغياب" وبناء خريطة أيام الغياب لكل طالب/مادة/ترم
async function loadAbsenceBase(){
  absenceDaysMap={}; absenceDaysMapByName={};
  try{
    const rows=await fetchSheet('قاعدة الغياب!A:H').catch(()=>[]);
    absenceRows=Array.isArray(rows)?rows:[]; // نحتفظ بالصفوف الخام لعرض التحضيرات السابقة
    const onlyDigits=s=>String(s||'').replace(/[^0-9]/g,'');
    // توحيد الشعبة: "شعبة 2" و"2" يصيران "2" — للفصل بين تسجيلات نفس المقرر
    const gk=g=>{const d=String(g||'').replace(/[^0-9]/g,'');return d||String(g||'').replace(/\s+/g,' ').trim();};
    const tk=t=>String(t||'').replace(/\s+/g,''); // توحيد اسم الترم (إزالة المسافات)
    // الأعمدة: A=الرقم · B=الاسم · C=المادة · D=رمز · E=شعبة · F=التاريخ · G=الحالة · H=الترم
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      const sid=onlyDigits(r[0]);
      if(!sid)continue;
      const status=String(r[6]||'').trim();
      if(status==='حاضر')continue; // ⭐ الحضور لا يُحسب في نسبة الغياب
      const days=(status==='متأخر')?0.5:1; // غائب=1 · متأخر=0.5
      // ⭐ نفهرس الغياب دائماً باسم المادة (+الشعبة+الترم) — هذا تعريف «المادة» الذي لا يلتبس.
      //    الرمز قد يكون فارغاً أو مكرَّراً بين مواد مختلفة، فالاعتماد عليه يخلط غياب مادة بأخرى.
      const cn=cnk_(r[2]);
      if(cn){
        const nkey=sid+'|'+cn+'|'+gk(r[4])+'|'+tk(r[7]);
        absenceDaysMapByName[nkey]=(absenceDaysMapByName[nkey]||0)+days;
      }
      // خريطة الرمز = شبكة أمان فقط للسجلات القديمة التي لا تحمل اسم مادة إطلاقاً
      const code=onlyDigits(r[3]);
      if(code&&!cn){
        const key=sid+'|'+code+'|'+gk(r[4])+'|'+tk(r[7]);
        absenceDaysMap[key]=(absenceDaysMap[key]||0)+days;
      }
    }
  }catch(e){}
}
// حساب نسبة الغياب لطالب في مادة من الخريطة (تعتمد على الجدول لإجمالي الأيام)
function absPctFromBase(sid,code,course,grp,term){
  const onlyDigits=s=>String(s||'').replace(/[^0-9]/g,'');
  const gk=g=>{const d=String(g||'').replace(/[^0-9]/g,'');return d||String(g||'').replace(/\s+/g,' ').trim();};
  const tk=t=>String(t||'').replace(/\s+/g,'');
  // ⭐ الغياب يُحسب لكل مادة على حدة عبر اسم المادة (+الشعبة+الترم) — لا يختلط بمواد اليوم الأخرى
  const nkey=onlyDigits(sid)+'|'+cnk_(course)+'|'+gk(grp)+'|'+tk(term);
  let absDays=absenceDaysMapByName[nkey];
  // شبكة أمان للسجلات القديمة بلا اسم مادة فقط: نطابق بالرمز إن لم يوجد أي غياب مطابق للاسم
  if(absDays===undefined){
    const key=onlyDigits(sid)+'|'+onlyDigits(code)+'|'+gk(grp)+'|'+tk(term);
    absDays=absenceDaysMap[key]||0;
  }
  if(!absDays)return 0; // ⭐ لا يوجد غياب لهذه المادة بالاسم = 0% دائماً
  // احتياطي: لو المادة غير مجدولة بالكامل، افترض يوم/أسبوع (8 حصص) بدل ما نُخفي الغياب
  let total=courseTotalDays(course,grp);
  if(!total) total=(typeof WEEKS_PER_HALF!=='undefined'?WEEKS_PER_HALF:8);
  return Math.min(Math.round(absDays/total*1000)/10,100);
}
function excuseHoursFromDates(course,grp,dates){
  const perHour=schedConfig.periodHours||2;
  let totalHrs=0;
  const breakdown=[];
  (dates||[]).forEach(dt=>{
    const day=dateToArDay(dt);
    const sessions=courseSessionsOnDay(course,grp,day);
    const hrs=sessions*perHour;
    totalHrs+=hrs;
    breakdown.push({date:dt,day,sessions,hrs});
  });
  return {totalHrs,breakdown};
}
function normCode(c){return String(c||'').replace(/\s+/g,'').trim()}
// ===== المواد العلمية المرتبطة بالمقرر (مستدامة — محفوظة مع المقرر في الخطة) =====
// الصيغة المخزّنة: كل مادة "العنوان @@ الرابط"، والمواد مفصولة بـ " ||| "
function parseMaterials(str){
  return String(str||'').split('|||').map(x=>x.trim()).filter(Boolean).map(x=>{
    const i=x.indexOf('@@');
    if(i>-1)return {title:x.slice(0,i).trim(),url:x.slice(i+2).trim()};
    return {title:'',url:x.trim()};
  }).filter(m=>m.url);
}
function serializeMaterials(arr){
  return (arr||[]).filter(m=>m&&m.url).map(m=>(m.title?m.title+' @@ ':'')+m.url).join(' ||| ');
}
// جلب المواد العلمية لمقرر من الخطة (نظري + عملي) بالمطابقة على الرمز
function getCourseMaterials(code){
  const cat=(catalog||[]).find(c=>normCode(c.code)===normCode(code));
  return {
    theory: cat?parseMaterials(cat.matTheory):[],
    practical: cat?parseMaterials(cat.matPractical):[]
  };
}
// عنصر عرض واحد للمادة: رابط قابل للضغط لو يبدأ بـ http، وإلا نص عادي (اسم مرجع)
function matChipHTML(m){
  const isLink=/^https?:\/\//i.test(m.url||'');
  const label=m.title||(isLink?'فتح المادة':m.url);
  if(isLink)return `<a href="${escUrl(m.url)}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:rgba(46,204,113,.12);color:#2ecc71;border:1px solid rgba(46,204,113,.3);border-radius:14px;padding:5px 12px;font-size:12px;font-weight:600">📄 ${esc(label)}</a>`;
  return `<span style="display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border);border-radius:14px;padding:5px 12px;font-size:12px">📄 ${esc(label)}${m.title&&m.url&&m.title!==m.url?` — ${esc(m.url)}`:''}</span>`;
}
// مفتاح موحّد للطالب: يحوّل الأرقام العربية ويزيل الرموز/المسافات لمنع التكرار
function sidKey(s){
  // ⭐ إصلاح: بيانات طلاب الإداري تستخدم حقل id بينما سجلات المقررات تستخدم sid — نقبل الاثنين
  const raw=String((s&&(s.sid||s.id))||'');
  const en=raw.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  const digits=en.replace(/\D/g,'').trim();
  return digits||raw.replace(/\s+/g,'').trim();
}
// فحص موحّد لحالة "حالي" (يتسامح مع المسافات والتشكيل والصيغ المختلفة)
function isActive(status){
  const s=String(status||'').replace(/\s+/g,'').replace(/[ًٌٍَُِّْ]/g,'').trim();
  return s==='حالي'||s==='حالى'||s.startsWith('حالي');
}
// إزالة تكرار الطلاب في مادة: طالب واحد لكل رقم أكاديمي (يحتفظ بأول شعبة)
function uniqStudents(arr){
  const map=new Map();
  arr.forEach(s=>{
    const k=sidKey(s);
    if(!map.has(k)||(s.grp&&map.get(k).grp&&String(s.grp)<String(map.get(k).grp)))map.set(k,s);
  });
  return [...map.values()];
}

// ===== مولّد الجدول الأوتوماتيكي =====
// ساعات الاتصال الأسبوعية لمادة (من قاعدة المقررات حسب الرمز)
function weeklyHours(code){
  const cat=catalog.find(c=>normCode(c.code)===normCode(code));
  return cat?(parseFloat(cat.hours)||0):0;
}
// تنسيق الوقت (رقم عشري لساعة بصيغة 12)
function fmtTime(h){
  h=((h%24)+24)%24;
  let hr=Math.floor(h), mn=Math.round((h-hr)*60);
  if(mn===60){hr++;mn=0;}
  const ampm=hr<12?'ص':'م';
  let h12=hr%12; if(h12===0)h12=12;
  return `${h12}:${String(mn).padStart(2,'0')} ${ampm}`;
}
// وقت الحصة رقم p (تبدأ من 0) — مع تخطّي وقت الاستراحة الثابت (12-1 ظهراً)
function periodTime(p){
  let s=schedConfig.startHour+p*schedConfig.periodHours;
  // الاستراحة ثابتة: إذا تجاوزت الحصة وقت بداية الاستراحة، تنزاح بمقدار مدتها
  const bStart=schedConfig.breakStart||12;  // بداية الاستراحة (12 ظهراً)
  const bHrs=schedConfig.breakHours||1;     // مدة الاستراحة (ساعة)
  if(schedConfig.breakStart&&s>=bStart)s+=bHrs;
  const e=s+schedConfig.periodHours;
  return fmtTime(s)+' - '+fmtTime(e);
}
// وقت الاستراحة الثابت (12-1 ظهراً افتراضياً)
function breakTime(){
  const s=schedConfig.breakStart||12;
  return fmtTime(s)+' - '+fmtTime(s+(schedConfig.breakHours||1));
}
// تحديد الحصة التي تأتي الاستراحة بعدها (للعرض في الجدول)
function breakAfterPeriod(){
  if(!schedConfig.breakStart)return -1;
  const bStart=schedConfig.breakStart;
  for(let p=0;p<schedConfig.periodsPerDay;p++){
    const pEnd=schedConfig.startHour+(p+1)*schedConfig.periodHours;
    if(pEnd>=bStart)return p; // الاستراحة بعد هذه الحصة
  }
  return schedConfig.periodsPerDay-1;
}
// يجلب المواد الحالية لشعبة + مدربيها + يحسب عدد الحصص الأسبوعية
function coursesForSchedule(grp){
  const seen={};
  const list=[];
  allCourses.forEach(c=>{
    if(c.grp!==grp)return;
    if(!isActive(c.status))return;
    if(isCoopTraining(c.code))return; // التدريب التعاوني ميداني — خارج الجدول الأسبوعي
    const key=normCode(c.code)||c.course;
    if(seen[key])return;
    seen[key]=1;
    const weekly=weeklyHours(c.code); // ساعات الاتصال الأسبوعية من القاعدة
    const sess=Math.max(1,Math.round(weekly/schedConfig.periodHours)||1);
    list.push({code:c.code,course:c.course,trainer:c.trainer||'—',weekly,sessions:Math.min(sess,DAYS.length)});
  });
  return list;
}
// التحقق من تعارض المدرب في نفس اليوم+الحصة عبر كل الشعب
function trainerBusy(grp,day,period,trainer,course){
  if(!trainer||trainer==='—')return false;
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  const tn=nrm(trainer);
  const cn=nrm(course);
  const slot=day+'|'+period;
  for(const g in schedule){
    if(g===grp)continue;
    const cell=schedule[g]&&schedule[g][slot];
    // السماح فقط إذا كان نفس المدرب ينادي نفس المادة (sections من نفس المادة)
    if(cell&&nrm(cell.trainer)===tn){
      if(nrm(cell.course)!==cn)return true; // تعارض: مادة مختلفة
    }
  }
  return false;
}
// التحقق من تعارض المعمل في نفس اليوم+الحصة عبر كل الشعب
// السماح بنفس القاعة فقط إذا كانت شعب مدمجة (نفس مادة + نفس مدرب)
function labBusy(grp,day,period,room,course,trainer){
  if(!room)return false;
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  const slot=day+'|'+period;
  for(const g in schedule){
    if(g===grp)continue;
    const cell=schedule[g]&&schedule[g][slot];
    if(cell&&cell.room===room){
      // إذا كانت شعب مدمجة (نفس مادة + نفس مدرب) → مسموح مشاركة القاعة
      if(course&&trainer&&nrm(cell.course)===nrm(course)&&nrm(cell.trainer)===nrm(trainer))continue;
      return true; // قاعة محجوزة بمادة/مدرب مختلف
    }
  }
  return false;
}
// اختيار أول معمل متاح لخانة
function freeLab(grp,day,period){
  for(const lab of LABS){if(!labBusy(grp,day,period,lab))return lab;}
  return LABS[0];
}
// الأيام الفعّالة حسب الإعداد
function activeDays(){return DAYS.slice(0,Math.min(schedConfig.daysCount||DAYS.length,DAYS.length));}
// توليد جدول لشعبة واحدة — تعبئة مضغوطة من الأحد + أوقات مبكرة + أيام أقل
function generateScheduleFor(grp){
  const courses=coursesForSchedule(grp);
  const grid={};
  const P=schedConfig.periodsPerDay;
  const days=activeDays();
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  // بناء قائمة حصص بترتيب round-robin (حصة من كل مادة بالتناوب)
  const queue=[];
  const maxSess=Math.max(0,...courses.map(c=>c.sessions));
  for(let r=0;r<maxSess;r++){
    courses.forEach(c=>{if(r<c.sessions)queue.push(c);});
  }
  // الخانات بالترتيب: الأحد أولاً ثم الأبكر فالأبكر
  const slots=[];
  for(const d of days){for(let p=0;p<P;p++){slots.push({day:d,p});}}
  // تتبّع آخر يوم استُخدم لكل مادة (تجنّب حصتين بنفس اليوم إن أمكن)
  const courseDayCount={};
  queue.forEach(c=>{
    let bestSlot=null;
    let fallback=null;
    // مرّ على الخانات بالترتيب، اختر أول خانة متاحة تحقق الشروط
    for(const s of slots){
      const slot=s.day+'|'+s.p;
      if(grid[slot])continue;
      // فحص تعارض المدرب عالمياً: مسموح فقط إذا كان يعلّم نفس المادة (شعب مدمجة)
      let trainerConflict=false;
      if(c.trainer&&c.trainer!=='—'){
        for(const og in schedule){
          if(og===grp)continue;
          const oc=schedule[og]&&schedule[og][slot];
          if(oc&&nrm(oc.trainer)===nrm(c.trainer)&&nrm(oc.course)!==nrm(c.course)){
            trainerConflict=true;break;
          }
        }
      }
      if(trainerConflict)continue; // تخطّ هذه الخانة — المدرب مشغول بمادة مختلفة
      const dk=c.code+'|'+s.day;
      if(courseDayCount[dk]){if(!fallback)fallback=s;continue;}
      bestSlot=s;break;
    }
    const chosen=bestSlot||fallback;
    if(chosen){
      const slot=chosen.day+'|'+chosen.p;
      if(!grid[slot]){
        // محاولة استخدام نفس القاعة إذا كانت الشعبة المدمجة بنفس المادة/الوقت
        let room=null;
        for(const og in schedule){
          if(og===grp)continue;
          const oc=schedule[og]&&schedule[og][slot];
          if(oc&&nrm(oc.trainer)===nrm(c.trainer)&&nrm(oc.course)===nrm(c.course)&&oc.room){
            room=oc.room;break; // نفس القاعة للشعب المدمجة
          }
        }
        if(!room)room=freeLab(grp,chosen.day,chosen.p);
        grid[slot]={code:c.code,course:c.course,trainer:c.trainer,room};
        courseDayCount[c.code+'|'+chosen.day]=(courseDayCount[c.code+'|'+chosen.day]||0)+1;
      }
    }
  });
  schedule[grp]=grid;
  return grid;
}

async function loadRubrics(){

    fetchSheet('بنود الدرجات!A:D').catch(()=>[]),
    fetchSheet('درجات تفصيلية!A:D').catch(()=>[])
  ]);
  rubrics={};
  for(let i=1;i<rub.length;i++){
    const r=rub[i]; const code=n0(r[0]); if(!code)continue;
    const k=normCode(code);
    if(!rubrics[k])rubrics[k]=[];
    rubrics[k].push({cat:n0(r[1]),max:parseFloat(r[2])||0,order:parseInt(n0(r[3]))||99});
  }
  for(const k in rubrics)rubrics[k].sort((a,b)=>a.order-b.order);
  gradeDetails=[];
  for(let i=1;i<det.length;i++){
    const r=det[i]; if(!n0(r[0]))continue;
    gradeDetails.push({key:n0(r[0]),code:n0(r[1]),cat:n0(r[2]),grade:parseFloat(r[3])||0});
  }
}

function rubricFor(code){return rubrics[normCode(code)]||[];}

function detailGrade(key,code,cat){

}
async function loadSchedule(){

}

// جداول المدربين: {مدرب: {يوم|حصة: {course,grp,room}}}
function buildTrainerSchedules(){
  const res={};
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  for(const grp in schedule){
    for(const slot in schedule[grp]){
      const c=schedule[grp][slot];
      if(!c.trainer||c.trainer==='—')continue;
      if(!res[c.trainer])res[c.trainer]={};
      // دمج الشعب: نفس وقت + نفس مادة → نجمع الشعب
      const ex=res[c.trainer][slot];
      if(ex&&nrm(ex.course)===nrm(c.course)){
        if(!ex.grps.includes(grp))ex.grps.push(grp);
        if(c.room&&!ex.rooms.includes(c.room))ex.rooms.push(c.room);
      }else{
        res[c.trainer][slot]={course:c.course,grps:[grp],rooms:c.room?[c.room]:[]};
      }
    }
  }
  return res;
}
// جداول القاعات: {قاعة: {يوم|حصة: {course,grps,trainer}}}
function buildRoomSchedules(){
  const res={};
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  for(const grp in schedule){
    for(const slot in schedule[grp]){
      const c=schedule[grp][slot];
      const room=c.room||'غير محدد';
      if(!res[room])res[room]={};
      // دمج الشعب: نفس وقت + نفس مادة + نفس مدرب → نجمع الشعب
      const ex=res[room][slot];
      if(ex&&nrm(ex.course)===nrm(c.course)&&nrm(ex.trainer)===nrm(c.trainer)){
        if(!ex.grps.includes(grp))ex.grps.push(grp);
      }else{
        res[room][slot]={course:c.course,grps:[grp],trainer:c.trainer};
      }
    }
  }
  return res;
}

const TRAINER_COLORS=['#1a7abf','#e67e22','#27ae60','#8e44ad','#c0392b','#16a085','#d4a017','#2c3e50','#e84393','#00857a','#6c5ce7','#a0522d','#0984e3','#b8860b'];
function trainerColor(name){
  const s=String(name||'').trim();
  if(!s||s==='—')return '#8894a8';
  let h=0; for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  return TRAINER_COLORS[h%TRAINER_COLORS.length];

function schReportTable(grid,cellRender){
  const days=activeDays();
  const P=schedConfig.periodsPerDay;
  const bAfter=breakAfterPeriod();
  const showBreak=bAfter>=0&&bAfter<P-1;
  const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
  // رؤوس الأعمدة مع إدراج عمود الاستراحة
  const head='<tr><th class="hc">اليوم</th>'+[...Array(P).keys()].map(p=>{
    const th=`<th>الحصة ${p+1}<br><small>${periodTime(p)}</small></th>`;
    return (p===bAfter&&showBreak)?th+`<th class="brk">☕<br><small>${breakTime()}</small></th>`:th;
  }).join('')+'</tr>';
  const body=days.map(d=>{
    let cells='';
    let p=0;
    while(p<P){
      const c=grid[d+'|'+p];
      if(!c){
        cells+='<td class="e">—</td>';
        if(p===bAfter&&showBreak)cells+='<td class="brk-cell">☕</td>';
        p++; continue;
      }
      // دمج الحصص المتتالية لنفس المادة (ونفس المدرب) — فقط للخلايا المفردة (لا الجدول العام متعدد المواد)
      let span=1;
      const mergeable=c&&!Array.isArray(c)&&c.course;
      if(mergeable){
        while(p+span<P){
          const nx=grid[d+'|'+(p+span)];
          const same=nx&&!Array.isArray(nx)&&nrm(nx.course)===nrm(c.course)&&nrm(nx.trainer||'')===nrm(c.trainer||'');
          const stopAtBreak=showBreak&&(p+span-1)===bAfter; // لا تدمج عبر الاستراحة
          if(!same||stopAtBreak)break;
          span++;
        }
      }
      const spanAttr=span>1?` colspan="${span}"`:'';
      cells+=`<td class="f"${spanAttr}>${cellRender(c)}</td>`;
      const lastP=p+span-1;
      if(showBreak&&lastP===bAfter)cells+='<td class="brk-cell">☕</td>';
      p+=span;
    }
    return `<tr><td class="tc">${d}</td>${cells}</tr>`;
  }).join('');
  return `<table class="rt">${head}${body}</table>`;
}

// سحب وإفلات لتعديل الجدول يدوياً
function schDrag(e,grp,slot){e.dataTransfer.setData('text',grp+'::'+slot)}
function schDrop(e,grp,toSlot){
  e.preventDefault();
  const data=e.dataTransfer.getData('text');
  // ===== سحب مادة من القائمة الجانبية =====
  if(data.indexOf('PAL::')===0){
    const src=window._schPalCourse;
    if(!src)return;
    const [toDay,toP]=toSlot.split('|');
    // فحص التعارض — تحذير فقط (لا يمنع)
    let warn='';
    if(src.trainer&&src.trainer!=='—'&&trainerBusy(grp,toDay,toP,src.trainer,src.course))
      warn=`⚠️ تنبيه: المدرب ${src.trainer} عنده مادة أخرى في نفس الوقت (تم الوضع مع التعارض)`;
    if(!schedule[grp])schedule[grp]={};
    schedule[grp][toSlot]={course:src.course,code:src.code,trainer:src.trainer,room:(LABS&&LABS[0])||''};
    showToast(warn||'✅ تمت إضافة المادة للحصة',warn?'w':'s');
    showAPage('schedule',null);
    return;
  }
  // ===== نقل داخل الجدول =====
  const [fromGrp,fromSlot]=data.split('::');
  if(fromGrp!==grp)return; // نفس الشعبة فقط
  const g=schedule[grp];
  if(!g||!g[fromSlot])return;
  const moving=g[fromSlot];
  const target=g[toSlot];
  const [toDay,toP]=toSlot.split('|');
  // فحص التعارضات — تحذير فقط (لا يمنع النقل)
  let warn='';
  if(moving.trainer&&moving.trainer!=='—'&&trainerBusy(grp,toDay,toP,moving.trainer,moving.course))
    warn=`⚠️ تعارض: المدرب ${moving.trainer} مشغول بمادة أخرى في نفس الوقت (تم النقل)`;
  else if(moving.room&&labBusy(grp,toDay,toP,moving.room,moving.course,moving.trainer))
    warn=`⚠️ تعارض: المعمل ${moving.room} محجوز في نفس الوقت (تم النقل)`;
  // تبديل أو نقل
  if(target){g[fromSlot]=target;}else{delete g[fromSlot];}
  g[toSlot]=moving;
  showToast(warn||'✅ تم نقل الحصة بنجاح',warn?'w':'s');
  showAPage('schedule',null);
}
// سحب مادة من القائمة الجانبية
function schPalDrag(e,grp,code){
  const list=coursesForSchedule(grp);
  const c=list.find(x=>normCode(x.code)===normCode(code));
  window._schPalCourse=c?{course:c.course,code:c.code,trainer:c.trainer}:null;
  e.dataTransfer.setData('text','PAL::'+grp+'::'+code);
  e.dataTransfer.effectAllowed='copy';
}
function schClear(grp,slot){
  if(!schedule[grp]||!schedule[grp][slot])return;
  const c=schedule[grp][slot];
  if(!confirm(`⚠️ هل تريد حذف: ${esc(c.course)}\\nالمدرب: ${esc(c.trainer)}\\n\\nسيتم حذفها من الجدول بشكل نهائي`))return;
  delete schedule[grp][slot];
  showToast('✅ تم حذف الحصة من الجدول','s');
  showAPage('schedule',null);
}
// تغيير معمل خانة مع تنبيه التعارض
function schSetRoom(grp,slot,room){
  if(!schedule[grp]||!schedule[grp][slot])return;
  const [day,p]=slot.split('|');
  const c=schedule[grp][slot];
  if(labBusy(grp,day,p,room,c.course,c.trainer)){
    showToast('⛔ المعمل محجوز بمادة أخرى بنفس الوقت','e');
    showAPage('schedule',null);return;
  }
  schedule[grp][slot].room=room;
}
function gradeToGPA(g){
  g=parseFloat(g)||0;
  if(g>=95)return 5.00;
  if(g>=90)return 4.75;
  if(g>=85)return 4.50;
  if(g>=80)return 4.00;
  if(g>=75)return 3.50;
  if(g>=70)return 3.00;
  if(g>=65)return 2.50;
  if(g>=60)return 2.00;
  return 1.00;
}
// ⭐ المقررات المكتملة فقط (المواد السابقة التي رُصدت لها درجات) — تُستثنى المواد الحالية من حساب المعدل
// المنطق: مثل الجامعات، الترم الحالي ما يُحسب في المعدل التراكمي حتى ترصد درجاته النهائية
function completedCourses(list){return (list||[]).filter(c=>!isActive(c.status));}
function hasCompleted(list){return completedCourses(list).length>0;}
// متوسط الدرجات من المكتملة فقط (رقم، 0 لو ما فيه مكتمل)
function avgPct(list){const d=completedCourses(list);if(!d.length)return 0;return Math.round(d.reduce((a,c)=>a+c.pct,0)/d.length);}
// متوسط الدرجات للعرض (يظهر — لو ما فيه مواد مكتملة)
function avgPctDisplay(list){const d=completedCourses(list);return d.length?Math.round(d.reduce((a,c)=>a+c.pct,0)/d.length)+'%':'—';}

function gpaFrom(list){
  const done=completedCourses(list); // المواد المكتملة فقط
  if(!done.length)return '0.00';
  const sum=done.reduce((a,c)=>a+gradeToGPA(c.pct),0);
  return (sum/done.length).toFixed(2);
}
// المعدل للعرض (يظهر — لو ما خلّص ولا مادة)
function gpaDisplay(list){return hasCompleted(list)?gpaFrom(list):'—';}
function gpaColor(gpa){gpa=parseFloat(gpa);return gpa>=4.5?'var(--green)':gpa>=3.5?'#6ab8f7':gpa>=2.5?'var(--gold)':'var(--red)'}
// تحويل الدرجة لنقاط المعدل (من 5) حسب نظام التدريب التقني
function gpaPoint(g){
  if(g>=95)return 5.0;
  if(g>=90)return 4.75;
  if(g>=85)return 4.5;
  if(g>=80)return 4.0;
  if(g>=75)return 3.5;
  if(g>=70)return 3.0;
  if(g>=65)return 2.5;
  if(g>=60)return 2.0;
  return 1.0;
}
// حساب المعدل التراكمي من 5 لقائمة مقررات
function calcGPA(list){
  const done=completedCourses(list); // المواد المكتملة فقط
  if(!done.length)return 0;
  const sum=done.reduce((a,c)=>a+gpaPoint(c.pct),0);
  return (sum/done.length).toFixed(2);
}
// لون المعدل من 5
function gpaColor(g){g=parseFloat(g);return g>=4?'var(--green)':g>=2.5?'var(--gold)':'var(--red)'}
function animCards(){
  setTimeout(()=>{
    document.querySelectorAll('.mcard').forEach((el,i)=>{el.classList.add('anim-scale','d'+(Math.min(i+1,6)));});
    document.querySelectorAll('.ccard').forEach((el,i)=>{el.classList.add('anim-up','d'+(Math.min(i+1,6)));});
    document.querySelectorAll('.iitem').forEach((el,i)=>{el.classList.add('anim-up','d'+(Math.min(i+1,6)));});
    document.querySelectorAll('.alert').forEach((el,i)=>{el.classList.add('anim-right','d'+(Math.min(i+1,6)));});
    document.querySelectorAll('.banner').forEach(el=>el.classList.add('anim-up'));
    initScrollObs();
    animNums();
  },50);

function initScrollObs(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')});
  },{threshold:.1,rootMargin:'0px 0px -30px 0px'});
  document.querySelectorAll('.anim-up,.anim-scale,.anim-right').forEach(el=>obs.observe(el));
}

function animNums(){
  document.querySelectorAll('.mnum[data-target]').forEach(el=>{
    const tgt=parseInt(el.dataset.target)||0;
    const suf=el.dataset.suffix||'';
    let cur=0,step=Math.max(1,Math.ceil(tgt/30));
    const t=setInterval(()=>{
      cur=Math.min(cur+step,tgt);
      el.textContent=cur+suf;
      if(cur>=tgt)clearInterval(t);
    },40);
  });
}

function showToast(msg,type='i'){
  const tc=document.getElementById('toastContainer');
  const t=document.createElement('div');
  const icons={i:'ℹ️',s:'✅',e:'❌',w:'⚠️'};
  t.className=`toast toast-${type}`;
  t.innerHTML=`<span class="toast-icon">${icons[type]||'ℹ️'}</span><span>${esc(msg)}</span>`;
  tc.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300)},3500);
}

function initParticles(){
  const bg=document.querySelector('.bg-layer');
  if(!bg||bg.querySelector('.part'))return;
  for(let i=0;i<8;i++){
    const p=document.createElement('div');
    p.className='part';
    const s=Math.random()*3+1;
    p.style.cssText=`position:absolute;width:${s}px;height:${s}px;border-radius:50%;left:${Math.random()*100}%;background:rgba(${Math.random()>.5?'230,57,70':'26,122,191'},${Math.random()*.3+.1});animation:particleRise ${Math.random()*15+10}s linear ${Math.random()*10}s infinite`;
    bg.appendChild(p);
  }
}

  if(user.role==='s'){

      else if(f==='مرفوض')list.push({type:'ad',icon:'❌',msg:`تم رفض طلبك: ${esc(lbl)}${r.notes?' — '+esc(r.notes):''}`});
      else if(f==='بانتظار التعديل')list.push({type:'aw',icon:'✏️',msg:`طلبك يحتاج تعديل: ${esc(lbl)}${r.notes?' — '+esc(r.notes):''}`});
      else list.push({type:'ab',icon:'⏳',msg:`طلبك قيد المراجعة (بانتظار ${esc(STAGE_LBL[reqActiveStage(r)]||'المراجعة')}): ${esc(lbl)}`});
    });
  } else {
    // المدرب/الإداري: كل ما وصل مرحلته وينتظر إجراءه
    requests.filter(r=>{const st=reqActiveStage(r);return st&&canActStage(st,r);}).forEach(r=>{
      list.push({type:'aw',icon:'📩',msg:`${esc(REQ_CATS[reqCat(r)].label)} ينتظر إجراءك — ${esc(r.sname||'')}${r.grp?' · شعبة '+esc(r.grp):''}${r.date?' · '+r.date:''}`});
    });
  }
  return list;
}

function getReviewCases(){
  const list=[];
  const src=user.role==='s'?courses:allCourses;
  const grpTxt=c=>(user.role!=='s'&&c.grp)?` · شعبة ${esc(c.grp)}`:'';
  src.forEach(c=>{
    const nm=user.role==='s'?c.course:c.sname;
    if(isHighAbs(c))list.push({type:'aw',icon:'⚠️',msg:`${nm} — غياب ${Math.round(c.abs)}% في ${esc(c.course)}${grpTxt(c)}`});

  });
  return list;
}

// ===== المكتبة العلمية (نظري + عملي لكل المقررات) =====
// scope: مصفوفة أكواد مسموحة (مقررات الطالب)، أو null = كل المقررات
function buildLibrary(scope, canAdd){
  const norm=c=>normCode(c);
  let cats=(catalog||[]).filter(c=>{
    const m=getCourseMaterials(c.code);
    const has=m.theory.length||m.practical.length;
    if(scope){ // الطالب: مقرراته فقط (حتى لو ما فيها مواد نعرضها لكن فاضية)
      return scope.some(code=>norm(code)===norm(c.code));
    }
    return canAdd?true:has; // المدرب/الإداري: الكل (canAdd يعرض حتى الفارغة للإضافة)
  });
  // إزالة التكرار بالكود
  const seen=new Set();cats=cats.filter(c=>{const k=norm(c.code);if(seen.has(k))return false;seen.add(k);return true;});
  const totalMats=cats.reduce((a,c)=>{const m=getCourseMaterials(c.code);return a+m.theory.length+m.practical.length;},0);
  const secBlock=(lbl,arr)=>arr.length?`<div style="margin-top:8px"><div style="font-size:11px;color:var(--muted);margin-bottom:5px">${lbl}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${arr.map(matChipHTML).join('')}</div></div>`:'';
  const cards=cats.map(c=>{
    const m=getCourseMaterials(c.code);
    const empty=!m.theory.length&&!m.practical.length;
    const matNames=[...m.theory,...m.practical].map(x=>(x&&(x.name||x.title))||'').join(' ');
    const sTxt=`${c.name||''} ${c.code||''} ${c.term||''} ${matNames}`.toLowerCase();
    return `<div class="ccard libcard" data-s="${esc(sTxt)}" style="cursor:default">
      <div class="cc-top"><div><div class="cc-name">${esc(c.name||c.code)}</div><div class="cc-meta">${esc(c.code)}${c.term?' · '+esc(fmtTerm(c.term)):''}</div></div>
        <span class="pill ${empty?'py':'pg'}">${empty?'لا مواد':(m.theory.length+m.practical.length)+' مادة'}</span></div>
      ${c.prereq?`<div style="margin-top:8px"><span style="display:inline-block;background:rgba(244,162,97,.15);color:#f4a261;border:1px solid rgba(244,162,97,.3);border-radius:10px;padding:3px 10px;font-size:11px;font-weight:600">📌 المتطلب السابق: ${esc(c.prereq)}</span></div>`:''}
      ${secBlock('📘 نظري',m.theory)}${secBlock('🔧 عملي',m.practical)}
      ${empty?'<div style="font-size:12px;color:var(--muted);margin-top:8px">لم تُضف مواد لهذا المقرر بعد</div>':''}
      ${canAdd?`<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)"><button class="btn btn-out btn-sm" onclick='libAddMat(${JSON.stringify({code:c.code,name:c.name}).replace(/'/g,"&#39;")})'>➕ أضف مادة علمية</button></div>`:''}
    </div>`;
  }).join('');
  return `
    <div class="stitle">📚 المكتبة العلمية</div>
    <div class="alert ab"><span class="aicon">📖</span>${scope?'المواد العلمية لمقرراتك (نظري + عملي)':'كل المواد العلمية لجميع المقررات'} · ${cats.length} مقرر · ${totalMats} مادة</div>
    ${cats.length?`<div class="list-search"><span class="ls-ico">🔍</span><input type="text" id="libSearchBox" placeholder="ابحث عن مقرر أو مادة..." oninput="libFilter(this.value)"><span class="ls-clear" onclick="libFilterClear()">✕</span></div>`:''}
    ${cats.length?`<div class="cgrid" id="libGrid">${cards}</div><div class="empty" id="libNoRes" style="display:none"><div class="empty-icon">🔍</div>لا نتائج مطابقة</div>`:'<div class="empty"><div class="empty-icon">📭</div>لا توجد مواد علمية بعد</div>'}`;
}
// فلترة المكتبة حسب البحث
function libFilter(q){
  q=(q||'').trim().toLowerCase();
  const grid=document.getElementById('libGrid'); if(!grid)return;
  let shown=0;
  grid.querySelectorAll('.libcard').forEach(el=>{
    const hit=!q||(el.getAttribute('data-s')||'').includes(q);
    el.style.display=hit?'':'none'; if(hit)shown++;
  });
  const nr=document.getElementById('libNoRes'); if(nr)nr.style.display=shown?'none':'block';
  const cl=document.querySelector('.list-search .ls-clear'); if(cl)cl.style.display=q?'flex':'none';
}

async function libSaveMat(code){
  const type=document.getElementById('libMatType').value;
  let title=document.getElementById('libMatTitle').value.trim();
  let url=document.getElementById('libMatUrl').value.trim();
  // إذا اختار ملفاً، نرفعه أولاً ونأخذ رابطه
  const fileInput=document.getElementById('libMatFile');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const f=fileInput.files[0];
    if(f.size>5*1024*1024){showToast('حجم الملف كبير (الحد 5 ميجا) — للملفات الكبيرة استخدم رابطاً','w');return;}
    if(!title) title=f.name.replace(/\.[^.]+$/,'');
    showToast('جاري رفع الملف...','i');
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej();r.readAsDataURL(f);}).catch(()=>'');
    if(!b64){showToast('تعذّر قراءة الملف','e');return;}
    let up=null;
    try{ up=await withRetry(()=>postJSONRead(SCRIPT_URL,{token:SESSION.token,action:'uploadFile',fileData:b64,fileName:f.name,mime:f.type||'application/octet-stream'}),2); }catch(e){ up=null; }
    if(!up||up.status!=='ok'||!up.url){showToast('تعذّر رفع الملف — جرّب لصق رابط بدلاً منه، أو تأكد من نشر الخادم (v17)','e');return;}
    url=up.url;
  }
  if(!url){showToast('ارفع ملفاً أو الصق رابطاً','w');return;}
  const c=(catalog||[]).find(x=>normCode(x.code)===normCode(code));
  if(!c){showToast('المقرر غير موجود','e');return;}
  const cur=getCourseMaterials(code);
  const arr=type==='theory'?cur.theory.slice():cur.practical.slice();
  arr.push({title,url});
  const rec={code:c.code,name:c.name,term:c.term,units:c.units,hours:c.hours,specs:c.specs||'',
    matTheory:type==='theory'?serializeMaterials(arr):serializeMaterials(cur.theory),
    matPractical:type==='practical'?serializeMaterials(arr):serializeMaterials(cur.practical),
    oldCode:c.code};
  showToast('جاري الحفظ...','i');
  try{
    const r=await jsonpCall({action:'updateCourse',data:JSON.stringify([rec])});
    if(!r || (r.status!=='ok' && r.ok!==true)){
      const m=(r&&(r.hint||r.msg))||'';
      if(m==='forbidden'||/صلاح|forbidden/i.test(m)) showToast('ما عندك صلاحية إضافة مواد (الإداري فقط)','e');
      else if(m==='unauthorized'||/unauthorized/i.test(m)) showToast('انتهت الجلسة — سجّل خروج ثم دخول من جديد','e');
      else showToast('تعذّر الحفظ'+(m?' — '+m:''),'e');
      return;
    }
    document.getElementById('libMatModal')?.remove();
    showToast('✅ تمت إضافة المادة','s');
    if(user.role==='t'){await loadTrainer();showTPage('library',document.getElementById('sn-library'));}
    else{await loadAdmin();showAPage('library',document.getElementById('sn-library'));}
  }catch(e){showToast('تعذّر الاتصال بالخادم — تأكد من نشر Apps Script وإعادة التفويض','e');}
}
window.libAddMat=libAddMat;window.libSaveMat=libSaveMat;

  schedule:()=>{
    const grp=user.grp;
    // مواد الطالب الحالية فقط (عشان مادة الإعادة ما تظهر لكل الشعبة)
    const nrm=s=>String(s||'').replace(/\s+/g,' ').trim();
    const myCourses=new Set(courses.filter(c=>isActive(c.status)).map(c=>nrm(c.course)));
    // هل المادة في الخانة من ضمن مواد الطالب؟
    const isMine=(c)=>c&&myCourses.has(nrm(c.course));
    // ⭐ اجمع حصص الطالب من كل الجداول (شعبته + أي شعبة يدرس معها مادة مشتركة كالإعادة)
    // الأولوية لجدول شعبة الطالب عند التعارض على نفس الخانة
    const myGrid={};
    const ownGrid=schedule[grp]||{};
    // أولاً من جدول شعبة الطالب
    for(const slot in ownGrid){if(isMine(ownGrid[slot]))myGrid[slot]=ownGrid[slot];}
    // ثم من بقية الشعب (لمواده التي يدرسها مع شعبة أخرى)
    for(const g in schedule){
      if(g===grp)continue;
      const gr=schedule[g]||{};
      for(const slot in gr){
        if(isMine(gr[slot])&&!myGrid[slot])myGrid[slot]={...gr[slot],_withGrp:g};
      }
    }
    const hasMine=Object.keys(myGrid).length>0;
    // استنتاج الأيام والحصص من حصص الطالب فقط
    const usedDays=DAYS.filter(d=>Object.keys(myGrid).some(s=>s.startsWith(d+'|')));
    const days=usedDays.length?usedDays:DAYS;
    const maxP=Math.max(1,...Object.keys(myGrid).map(s=>parseInt(s.split('|')[1])+1));
    const P=hasMine?maxP:5;
    const cell=(day,p)=>{
      const c=myGrid[day+'|'+p];
      return c?`<td class="sch-cell filled"><div class="sch-item-v"><div class="sch-course">${esc(c.course)}</div>${c.trainer?`<div class="sch-trainer">${esc(c.trainer)}</div>`:''}${c.room?`<div class="sch-room-tag">${c.room}</div>`:''}${c._withGrp?`<div class="sch-room-tag" style="background:rgba(244,162,97,.2);color:#f4a261;margin-top:2px">مع شعبة ${esc(c._withGrp)}</div>`:''}</div></td>`:'<td class="sch-cell"><span class="sch-empty">—</span></td>';
    };
    const bAfter=breakAfterPeriod();
    const headCells=[...Array(P).keys()].map(p=>{
      const th=`<th>الحصة ${p+1}<div class="sch-time-sm">${periodTime(p)}</div></th>`;
      return (p===bAfter&&bAfter>=0&&bAfter<P-1)?th+`<th style="background:var(--gold);color:#000;width:46px">☕<div style="font-size:8px">${breakTime()}</div></th>`:th;
    }).join('');
    const rowCells=(d)=>[...Array(P).keys()].map(p=>{
      const c=cell(d,p);
      return (p===bAfter&&bAfter>=0&&bAfter<P-1)?c+`<td style="background:rgba(201,162,39,.15);text-align:center;color:var(--gold)">☕</td>`:c;
    }).join('');
    const hasCurrentCourses=courses.some(c=>isActive(c.status)&&!isCoopTraining(c.code));
    const emptyMsg=hasCurrentCourses
      ? '<div class="empty"><div class="empty-icon">📅</div><div>لم يُعتمد جدولك بعد</div><div style="font-size:12px;color:var(--muted);margin-top:8px">عندك مواد حالية — سيظهر جدولك هنا فور اعتماده من الإدارة</div></div>'
      : '<div class="empty"><div class="empty-icon">📭</div><div>ما عندك جدول حالياً</div><div style="font-size:12px;color:var(--muted);margin-top:8px">لأنه ما عندك مواد مسجّلة هذا الفصل · راجع الإدارة لو تتوقع غير ذلك</div></div>';
    return `
    <div class="stitle">📅 جدولي الأسبوعي — الشعبة ${grp}</div>
    ${hasMine?`
    <div class="alert ab"><span class="aicon">🗓️</span>جدول حصصك الأسبوعي المعتمد (موادك المسجّلة فقط)</div>
    <div class="sch-wrap"><table class="sch-table">
      <thead><tr><th>اليوم</th>${headCells}</tr></thead>
      <tbody>${days.map(d=>`<tr><td class="sch-pnum">${d}</td>${rowCells(d)}</tr>`).join('')}</tbody>
    </table></div>`:emptyMsg}`;
  },

// بانر تنبيهات الغياب للطالب (من الإنذار الأول 10%) مع زر عذر مباشر
function absWarnBanner(){
  const cur=courses.filter(c=>isActive(c.status)&&(parseFloat(c.abs)||0)>=10);
  if(!cur.length)return '';
  return '<div style="margin-bottom:16px">'+cur.sort((a,b)=>b.abs-a.abs).map(c=>{
    const lv=absLevel(c.abs);
    const urgent=lv.key==='deprived';
    return `<div class="alert ${urgent?'ad':'aw'}" style="${urgent?'border:2px solid var(--red)':''};display:flex;align-items:center;gap:10px">
      <span class="aicon">${urgent?'⛔':lv.key==='warn2'?'🔶':'⚠️'}</span>
      <div style="flex:1">
        <div style="font-weight:700;color:${urgent?'var(--red)':av_color(lv)}">${urgent?'محروم رسمياً':lv.label} — ${esc(c.course)}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">غيابك <strong>${Math.round(c.abs)}%</strong>${urgent?' — وصلت حد الحرمان (25%)':' — قدّم عذرك قبل الوصول للحرمان (25%)'}</div>
      </div>
      <button class="btn ${urgent?'btn-r':'btn-out'} btn-sm" onclick="goExcuse('${esc(c.course.replace(/'/g,"\\'"))}')">📨 ارفع عذر</button>
    </div>`;
  }).join('')+'</div>';
}
function av_color(lv){return lv.color}
// الانتقال لصفحة الخدمات مع تعبئة العذر تلقائياً
function goExcuse(course){
  showSPage('services',null);
  setTimeout(()=>{
    const t=document.getElementById('rq-type');
    if(t){t.value='عذر غياب';toggleExcuseFields();}
    const sel=document.getElementById('rq-course');
    if(sel){for(const o of sel.options){if(o.value===course){sel.value=course;break;}}}
    const fld=document.getElementById('excuse-fields');
    if(fld)fld.scrollIntoView({behavior:'smooth',block:'center'});
  },120);
}

function courseCardHTML(c){
  const p=Math.round(c.pct);
  const av=absLevel(c.abs);
  const showWarn=av.key!=='ok'&&isActive(c.status);
  const mats=getCourseMaterials(c.code); // المواد العلمية (نظري + عملي)
  const matSection=(lbl,arr)=>arr.length?`<div style="margin-top:8px"><div style="font-size:11px;color:var(--muted);margin-bottom:5px">${lbl}</div><div style="display:flex;flex-wrap:wrap;gap:6px">${arr.map(matChipHTML).join('')}</div></div>`:'';
  const matsHTML=(mats.theory.length||mats.practical.length)?`<div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)">
    <div style="font-size:11px;color:#6ab8f7;font-weight:700;margin-bottom:4px">📚 المادة العلمية</div>
    ${matSection('📘 نظري',mats.theory)}${matSection('🔧 عملي',mats.practical)}
  </div>`:'';
  // تفصيل الدرجات حسب البنود (إن وُجدت)
  const rub=rubricFor(c.code);
  let detHTML='';
  if(rub.length){
    const key=c.key||((c.code||'')+'-'+(c.sid||''));
    const rows=rub.map(r=>{const g=detailGrade(key,c.code,r.cat);return g!==''?`<div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0"><span style="color:var(--muted)">${esc(r.cat)}</span><span style="font-weight:700">${g} / ${r.max}</span></div>`:'';}).filter(Boolean).join('');

window._attFilter={q:'',course:'all'};
function atlDig(s){return String(s||'').replace(/[^0-9]/g,'');}
function atlFmtDate(v){const s=String(v||'').trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)return s.slice(0,10);const d=new Date(s);return isNaN(d)?s:(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear());}
function atlDnum(d){const m=String(d).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);return m?((m[3].length===2?'20'+m[3]:m[3])+m[2].padStart(2,'0')+m[1].padStart(2,'0')):'0';}
const _ATL_COLORS=['#1a7abf','#2ecc71','#9b59b6','#e67e22','#16a085','#2980b9','#8e44ad','#d35400'];
function atlColor(str){let h=0;const s=String(str||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return _ATL_COLORS[h%_ATL_COLORS.length];}
function atlInitials(name){const p=String(name||'').trim().split(/\s+/).filter(Boolean);return(((p[0]||'').charAt(0))+((p[1]||'').charAt(0)||'')).trim()||'؟';}
function atlDateBox(date){const m=String(date).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);const dd=m?m[1]:'—';const yy=m?(m[3].length===2?m[3]:m[3].slice(-2)):'';const AR=['','ينا','فبر','مار','أبر','ماي','يون','يول','أغس','سبت','أكت','نوف','ديس'];const mon=m?(AR[parseInt(m[2])]||''):'';return `<div class="atl-datebox"><div class="d">${dd}</div><div class="my">${mon} ${yy}</div></div>`;}
function atlBuildSessions(editable){
  const rows=(typeof absenceRows!=='undefined'&&Array.isArray(absenceRows))?absenceRows:[];
  const gk_=g=>{const d=String(g||'').replace(/[^0-9]/g,'');return d||String(g||'').replace(/\s+/g,' ').trim();};
  // ⭐ نطاق المدرب: فقط مواده هو بالاسم (+الشعبة) فقط. لا نطابق بالرمز إطلاقاً لأن الرمز
  //    قد يكون فارغاً أو مكرَّراً بين مواد مختلفة فيُظهر للمدرب مادة ليست له (مثل الإنجليزي).
  const mineCG=editable?null:new Set(students.map(s=>cnk_(s.course)+'|'+gk_(s.grp)));
  const sessions=new Map();
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!atlDig(r[0]))continue;
    const cname=r[2]||'', codeR=r[3]||'', grpR=gk_(r[4]);
    if(!editable){if(!mineCG.has(cnk_(cname)+'|'+grpR))continue;}
    const date=atlFmtDate(r[5]), grp=String(r[4]||'').trim(), term=String(r[7]||'').trim(), status=String(r[6]||'').trim();
    const key=date+'|'+cnk_(cname)+'|'+grp+'|'+term.replace(/\s+/g,'');
    if(!sessions.has(key))sessions.set(key,{date,course:cname,code:codeR,grp,term,students:[]});
    sessions.get(key).students.push({name:r[1]||'',sid:String(r[0]||''),code:codeR,status:status==='متأخر'?'متأخر':status==='حاضر'?'حاضر':'غائب'});
  }
  const list=[...sessions.values()];
  list.sort((a,b)=>atlDnum(b.date).localeCompare(atlDnum(a.date)));
  return list;
}

function attlogCards(){

  const filtered=list.filter(s=>{

    let studs=s.students.map((st,i)=>({st,i})).sort((a,b)=>(a.st.status===b.st.status?0:a.st.status==='غائب'?-1:1));
    const courseMatch=q&&String(s.course).includes(q);
    if(q&&!courseMatch)studs=studs.filter(o=>o.st.name.includes(q)||o.st.sid.includes(q));

async function submitLessonPrep(){
  const g=id=>String((document.getElementById(id)||{}).value||'').trim();
  const chk=cls=>[...document.querySelectorAll('.'+cls+':checked')].map(x=>x.value).join('، ');
  // اجمع التواريخ المتعددة وسلسلها في حقل واحد: date~period~cls|...
  const sess=[...document.querySelectorAll('#lp_sessions .lp-srow')].map(r=>({
    date:(r.querySelector('.lp-sdate')||{}).value||'',
    period:((r.querySelector('.lp-speriod')||{}).value||'').trim(),
    cls:((r.querySelector('.lp-scls')||{}).value||'').trim()
  })).filter(x=>x.date||x.period||x.cls);
  const serial=sess.map(x=>[x.date,x.period,x.cls].join('~')).join('|');
  const obj={material:g('lp_material'),branch:g('lp_branch'),grade:g('lp_grade'),date:serial,period:'',topic:g('lp_topic'),outcomes:g('lp_outcomes'),intro:g('lp_intro'),present:g('lp_present'),eval:g('lp_eval'),homework:g('lp_homework'),methods:chk('lp-m'),sources:chk('lp-s'),media:chk('lp-w'),activities:chk('lp-a')};
  if(!obj.material||!obj.topic){showToast('أدخل المادة وموضوع الدرس على الأقل','w');return;}
  showToast('جاري الإرسال...','i');
  try{
    const res=await jsonpCall({action:'saveLessonPrep',data:JSON.stringify(obj)});
    if(res&&res.status&&res.status!=='ok'){showToast('❌ تعذّر الإرسال: '+attErrMsg(res.msg,res.hint),'e');return;}
    showToast('✅ تم إرسال التحضير للإدارة','s');
    await loadLessonPreps();
    showTPage('lesson',document.getElementById('sn-lesson'));
  }catch(e){showToast('تعذّر الإرسال — جرب مرة أخرى','e');}
}
async function delLessonPrep(id){
  if(!confirm('حذف هذا التحضير نهائياً؟'))return;
  showToast('جاري الحذف...','i');
  try{
    const res=await jsonpCall({action:'deleteLessonPrep',data:JSON.stringify({id:id})});
    if(res&&res.status&&res.status!=='ok'){showToast('❌ تعذّر الحذف: '+attErrMsg(res.msg,res.hint),'e');return;}
    lessonPreps=lessonPreps.filter(x=>String(x.id)!==String(id)); // تحديث فوري
    showToast('✅ تم الحذف','s');
    if(user&&user.role==='a')showAPage('lessons',document.getElementById('sn-lessons'));
    else showTPage('lesson',document.getElementById('sn-lesson'));
    loadLessonPreps().catch(()=>{}); // مزامنة صامتة
  }catch(e){showToast('تعذّر الحذف — جرب مرة أخرى','e');}
}

    const tSched={};

        if(nrm(c.trainer)===nrm(user.name)){
          // إذا فيه حصة بنفس الوقت ونفس المادة، نجمع الشعب

      <tbody>${days.map(d=>`<tr><td class="sch-pnum">${d}</td>${rowCells(d)}</tr>`).join('')}</tbody>
    </table></div>`:emptyMsg}`;
  },
  home:()=>{
    const crs=[...new Set(students.map(s=>s.course))];
    const avg=students.length?Math.round(students.reduce((a,s)=>a+s.pct,0)/students.length):0;

    };

// عند إدخال ساعات الغياب: احسب النسبة وحدّثها فورياً
function onAbsHours(sid,code,val){
  if(!attendanceData[sid])attendanceData[sid]={};
  attendanceData[sid].hours=val;
  attendanceData[sid].code=code;
  const hours=parseFloat(val)||0;
  const pct=absHoursToPct(hours,code);
  const lv=absLevel(pct);
  const el=document.getElementById('ap-'+sid);
  if(el){
    el.style.color=lv.color;
    el.textContent=val!==''?`${pct}% · ${lv.label}`:'';
  }
}

// ===== تسجيل الحضور (حاضر/متأخر/غائب) =====
let attMarks={};
let attCurrentCourse=null; // تتبّع المادة الحالية لتجنب التضارب
// ⭐ مفتاح العلامة لكل (مادة + طالب) — يمنع أن يغيب الطالب على اليوم كامل بدل المادة الواحدة
const amKey=(course,sid)=>cnk_(course)+'::'+String(sid);
const amId=(course,sid)=>('mk-'+cnk_(course)+'-'+String(sid)).replace(/[^\w؀-ۿ-]/g,'_');
function setMark(course,sid,mark){
  attMarks[amKey(course,sid)]=mark;
  const idb=amId(course,sid);
  ['present','late','absent'].forEach(k=>{const b=document.getElementById(idb+'-'+k);if(b)b.classList.remove('on');});
  const b=document.getElementById(idb+'-'+mark);if(b)b.classList.add('on');
}
function markAll(course,mark){
  uniqStudents(students.filter(s=>s.course===course&&isActive(s.status))).forEach(s=>setMark(course,s.sid,mark));
}
// مسح علامات مادة واحدة فقط (لا يمس علامات المواد الأخرى المعلّقة)
function clearMarks(course){
  const pre=cnk_(course)+'::';
  Object.keys(attMarks).forEach(k=>{if(k.indexOf(pre)===0)delete attMarks[k];});
  showTPage('attendance',null);
}
window.clearMarks=clearMarks;
// ترجمة رسائل خطأ الخادم إلى عربي واضح للمستخدم
function attErrMsg(msg,hint){
  const m=String(msg||'');
  if(m==='forbidden-course') return (hint||'لست مدرّب هذه المادة ولا مكلَّفاً بها') + ' — تأكد أن اسمك في «سجل المقررات» يطابق اسم دخولك، أو أن التكليف يشمل نطاق «تحضير».';
  if(m==='forbidden') return 'لا تملك صلاحية هذه العملية.';
  if(m==='unauthorized') return 'انتهت صلاحية جلسة الدخول — سجّل خروج ثم دخول من جديد.';
  return m || 'خطأ غير معروف من الخادم';
}
// حفظ حضور اليوم: غائب=حصة كاملة، متأخر=نصف حصة (تأخيرين=غياب)
async function saveSession(course,code,sessionHrs){
  let total=courseTotalHours(code);
  // لو المادة مالها ساعات في قاعدة المقررات: نستخدم تقدير افتراضي
  // (افتراض 4 ساعات أسبوعية × عدد الأسابيع) عشان الغياب يُحسب ولا يتوقف
  if(!total){
    total=(4)*(typeof WEEKS_PER_HALF!=='undefined'?WEEKS_PER_HALF:8);
    showToast('⚠️ المادة مالها ساعات بالقاعدة — استُخدم تقدير افتراضي','w');
  }
  // كل سجلات الطلاب الحاليين بهذه المادة (تشمل الشعب المتعددة)
  const allRecs=students.filter(s=>s.course===course&&isActive(s.status));
  // العلامة لكل طالب موحّد (بمفتاح الرقم الأكاديمي)
  const markByKey={};
  allRecs.forEach(s=>{const mk=attMarks[s.sid];if(mk)markByKey[sidKey(s)]=mk;});
  const records=[];
  let marked=0, absC=0, lateC=0;
  const counted=new Set(); // إحصاء كل طالب مرة واحدة بالعدّاد
  allRecs.forEach(s=>{
    const k=sidKey(s);
    const mk=markByKey[k];
    if(!mk)return;
    if(!counted.has(k)){counted.add(k);marked++;if(mk==='absent')absC++;else if(mk==='late')lateC++;}
    let add=0;
    if(mk==='absent')add=sessionHrs;
    else if(mk==='late')add=sessionHrs/2;
    if(add>0){
      const curHrs=(parseFloat(s.abs)||0)/100*total;
      const newPct=Math.min(Math.round((curHrs+add)/total*1000)/10,100);
      s.abs=newPct;
      // حفظ في كل سجل للطالب بهذه المادة (شعب متعددة → كلها تتحدّث)
      records.push({key:s.key,sid:s.sid,code:s.code,grp:s.grp,absence:newPct});
    }
  });
  if(!marked){showToast('سجّل حضور المتدربين أولاً','w');return;}
  showToast('جاري حفظ الحضور...','i');
  try{
    if(records.length){
      // إرسال عبر JSONP عشان نقرأ الرد ونعرف كم سجل تحدّث فعلياً
      const res=await jsonpCall({action:'saveAttendance',data:JSON.stringify(records)});
      // فحص حالة الرد أولاً: لو رفض الخادم نعرض السبب الحقيقي بدل نجاح وهمي
      if(res && res.status && res.status!=='ok'){
        showToast('❌ الخادم رفض الحفظ: '+attErrMsg(res.msg,res.hint),'e');
        return;
      }
      const upd=(res&&typeof res.updated!=='undefined')?res.updated:null;
      if(upd!==null && upd===0){
        // ما تحدّث ولا سجل → المفتاح/الرقم ما تطابق بالشيت
        showToast('⚠️ ما تحدّث أي سجل بالشيت — تأكد من بيانات الطلاب','e');
        return;
      }
      showToast(`✅ تم حفظ الحضور — ${absC} غياب · ${lateC} تأخير`+(upd!==null?` (${upd} سجل)`:''),'s');
    }else{
      showToast(`✅ تم حفظ الحضور — ${absC} غياب · ${lateC} تأخير`,'s');
    }
    attMarks={}; // مسح الحضور بعد الحفظ الناجح
    attCurrentCourse=null;
    showTPage('attendance',null);
  }catch(e){showToast('تعذر الحفظ — جرب مرة أخرى','e');}
}

// ===== حفظ الغياب الجديد (بالأيام · مربوط بالجدول) =====
async function saveSessionV2(course,code,grp,dateStr){
  let totalDays=courseTotalDays(course,grp);
  // احتياطي: لو المادة مو موجودة بالجدول، نفترض يوم واحد بالأسبوع (8 أيام) بدل منع الحفظ
  if(!totalDays){
    totalDays=(typeof WEEKS_PER_HALF!=='undefined'?WEEKS_PER_HALF:8);
    showToast('ℹ️ المادة غير مجدولة — حُسبت بيوم/أسبوع افتراضياً','i');
  }
  // طلاب هذه المادة (الحاليون)
  const allRecs=students.filter(s=>s.course===course&&isActive(s.status));
  const markByKey={};
  allRecs.forEach(s=>{const mk=attMarks[amKey(course,s.sid)];if(mk)markByKey[sidKey(s)]=mk;});
  const records=[];   // لتحديث نسبة الغياب في سجل المقررات
  const dailyLog=[];  // لتسجيل الغياب اليومي في التبويب الجديد
  let marked=0, absC=0, lateC=0;
  const counted=new Set();
  allRecs.forEach(s=>{
    const k=sidKey(s);
    const mk=markByKey[k];
    if(!mk)return;
    if(!counted.has(k)){counted.add(k);marked++;if(mk==='absent')absC++;else if(mk==='late')lateC++;}
    // أيام الغياب المضافة اليوم: غائب=1 · متأخر=0.5 · حاضر=0
    let addDays=0;
    if(mk==='absent')addDays=1;
    else if(mk==='late')addDays=0.5;
    // ⭐ الرمز والشعبة من سجل الطالب نفسه (لأن تبويب «الجدول» لا يخزّن رمز المقرر)
    //    وإلا يُحفظ الغياب بلا رمز فتفشل مطابقة النسبة وتظهر 0%
    const sCode=normCode(s.code||code), sGrp=s.grp||grp;
    // ⭐ سجل يومي لكل متدرب مُعلّم (حاضر/متأخر/غائب) — حتى لو الكل حاضر يُحفظ سجل اليوم
    dailyLog.push({sid:s.sid,name:s.name,course,code:sCode,grp:sGrp,date:dateStr,status:mk==='absent'?'غائب':mk==='late'?'متأخر':'حاضر',days:addDays,term:s.half||''});
    if(addDays>0){
      // الأيام المحفوظة سابقاً = النسبة الحالية × إجمالي الأيام ÷ 100
      const curDays=(parseFloat(s.abs)||0)/100*totalDays;
      const newDays=curDays+addDays;
      const newPct=Math.min(Math.round(newDays/totalDays*1000)/10,100);
      s.abs=newPct;
      records.push({key:s.key,sid:s.sid,code:sCode,grp:sGrp,absence:newPct});
    }
  });
  if(!marked){showToast('سجّل حضور المتدربين أولاً','w');return;}
  showToast('جاري حفظ غياب اليوم...','i');
  try{
    // 1) الأساسي: تسجيل الغياب اليومي في "قاعدة الغياب" (المصدر الوحيد للنسبة)
    //    نحفظه أولاً ونتحقق من نجاحه — لأنه هو الذي يظهر في النظام فعلياً
    if(dailyLog.length){
      const resD=await jsonpCall({action:'saveDailyAbsence',data:JSON.stringify(dailyLog)});
      if(resD && resD.status && resD.status!=='ok'){
        showToast('❌ الخادم رفض حفظ الغياب: '+attErrMsg(resD.msg,resD.hint),'e');
        return;
      }
    }
    // 2) ثانوي (أفضل جهد): تحديث عمود "نسبة الغياب" في سجل المقررات — لا يوقف العملية إن فشل
    let upd=null, colWarn='';
    if(records.length){
      try{
        const res=await jsonpCall({action:'saveAttendance',data:JSON.stringify(records)});
        if(res && res.status && res.status!=='ok'){
          colWarn=' (لكن عمود «نسبة الغياب» بسجل المقررات لم يُحدَّث: '+attErrMsg(res.msg,res.hint)+')';
        }else{
          upd=(res&&typeof res.updated!=='undefined')?res.updated:null;
          if(upd===0) colWarn=' (لم يُحدَّث عمود «نسبة الغياب» — الطالب غير مسجّل بهذه المادة في سجل المقررات)';
        }
      }catch(e){ colWarn=' (تعذّر تحديث عمود «نسبة الغياب» — الغياب محفوظ في قاعدة الغياب)'; }
    }
    showToast(`✅ تم حفظ غياب ${dateStr} — ${absC} غياب · ${lateC} تأخير`+(upd?` (${upd} سجل)`:'')+colWarn, colWarn?'w':'s');
    // ⭐ نمسح علامات هذه المادة فقط — تبقى علامات المواد الأخرى المعلّقة كما هي
    const pre=cnk_(course)+'::';
    Object.keys(attMarks).forEach(k=>{if(k.indexOf(pre)===0)delete attMarks[k];});
    attCurrentCourse=null;
    // s.abs تحدّثت في الذاكرة قبل الإرسال → نعرض الصفحة فوراً بالقيم الجديدة
    // (لا نعيد التحميل من الشيت لأن الكتابة قد تتأخر ثانية فتعود القيم القديمة)
    showTPage('attendance',null);
    // إعادة تحميل صامتة بعد 3 ثوانٍ لمزامنة أي تغييرات أخرى (دون مسح ما يظهر)
    setTimeout(()=>{if(typeof loadTrainer==='function')loadTrainer().catch(()=>{});},3000);
  }catch(e){showToast('تعذر الحفظ — جرب مرة أخرى','e');}
}

async function saveAttendance(course){
  const ss=students.filter(s=>s.course===course);
  const records=[];
  ss.forEach(s=>{
    const d=attendanceData[s.sid];
    if(d&&d.hours!==''&&d.hours!=null){
      const hours=parseFloat(d.hours)||0;
      const absence=absHoursToPct(hours,s.code); // النسبة المحسوبة
      records.push({key:s.key,sid:s.sid,absence});
    }
  });
  if(!records.length){showToast('لم تُدخل أي ساعات غياب','w');return}
  showToast('جاري الحفظ...','i');
  try{
    const url=SCRIPT_URL+'?action=saveAttendance&data='+encodeURIComponent(JSON.stringify(records))+'&token='+encodeURIComponent(SESSION.token);
    await new Promise((resolve,reject)=>{
      const cb='cb_'+Date.now();
      window[cb]=(d)=>{
        delete window[cb];
        document.getElementById('jsonp_'+cb)?.remove();
        if(d.status==='ok') resolve(d);
        else reject(new Error(d.msg));
      };
      const s=document.createElement('script');
      s.id='jsonp_'+cb;
      s.src=url+'&callback='+cb;
      s.onerror=()=>{delete window[cb];reject(new Error('network'))};
      document.head.appendChild(s);
    });
    showToast('✅ تم حفظ الحضور في الشيت','s');
  }catch(e){
    // لو الخطأ رسالة صلاحية من الخادم نعرضها بوضوح (لا نُظهر نجاحاً وهمياً)
    const em=String(e&&e.message||'');
    if(em && em!=='network' && em!=='timeout'){
      showToast('❌ الخادم رفض الحفظ: '+attErrMsg(em),'e');
      return;
    }
    // تعذّر الوصول فقط (شبكة) → مسار احتياطي بلا قراءة للرد
    try{
      await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({token:SESSION.token,action:'saveAttendance',records}),headers:{'Content-Type':'text/plain'}});
      showToast('⚠️ أُرسل الحضور بدون تأكيد — تحقّق من الشيت','w');
    }catch(e2){showToast('تعذر الحفظ — جرب مرة أخرى','e');}
  }
}

// حساب المجموع الأولي لطالب من درجاته المحفوظة
function rbInitTotal(key,code,rub){
  let sum=0,any=false;
  rub.forEach(r=>{const v=detailGrade(key,code,r.cat);if(v!==''){sum+=parseFloat(v)||0;any=true;}});
  return any?Math.round(sum*10)/10:'—';
}
// إعادة حساب مجموع صف طالب عند الإدخال
function rbSum(cid,sk){
  let sum=0,any=false;
  document.querySelectorAll('.'+cid+'[data-key="'+sk+'"]').forEach(inp=>{
    const max=parseFloat(inp.dataset.max)||0;
    let v=parseFloat(inp.value);
    if(!isNaN(v)){if(v>max){v=max;inp.value=max;}if(v<0){v=0;inp.value=0;}sum+=v;any=true;}
  });
  const tot=document.getElementById('tot-'+cid+'-'+sk);
  if(tot){const t=Math.round(sum*10)/10;tot.textContent=any?t:'—';tot.style.color=t>=60?'#2ecc71':t>0?'#e74c3c':'#999';}
}

function rubRow(it,i){
  return `<div class="rub-row" style="display:flex;gap:8px;margin-bottom:8px;align-items:center">
    <input class="rub-cat" placeholder="اسم البند (مثل: واجب)" value="${esc(it.cat||'')}" oninput="rubUpdateTotal()" style="flex:2;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--card,rgba(255,255,255,.03));color:var(--text);font-size:13px">
    <input class="rub-max" type="number" min="0" max="100" placeholder="الدرجة" value="${it.max||''}" oninput="rubUpdateTotal()" style="flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--card,rgba(255,255,255,.03));color:var(--text);font-size:13px">
    <button onclick="this.closest('.rub-row').remove();rubUpdateTotal()" style="background:rgba(231,76,60,.15);color:#e74c3c;border:none;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;flex-shrink:0">🗑️</button>
  </div>`;
}
function rubAddRow(){document.getElementById('rubItems').insertAdjacentHTML('beforeend',rubRow({cat:'',max:''}));rubUpdateTotal();}
function rubUpdateTotal(){
  let sum=0;document.querySelectorAll('#rubItems .rub-max').forEach(i=>sum+=parseFloat(i.value)||0);
  const bar=document.getElementById('rubTotalBar');if(!bar)return;
  const ok=sum===100;
  bar.textContent='المجموع: '+sum+' / 100'+(ok?' ✅':' (يجب أن يساوي 100)');
  bar.style.background=ok?'rgba(46,204,113,.15)':'rgba(231,76,60,.12)';
  bar.style.color=ok?'#2ecc71':'#e74c3c';
}
async function saveRubricSetup(){
  const code=document.getElementById('rubCode').value;
  const rows=[...document.querySelectorAll('#rubItems .rub-row')];
  const items=[];
  for(const r of rows){
    const cat=r.querySelector('.rub-cat').value.trim();
    const max=parseFloat(r.querySelector('.rub-max').value)||0;
    if(cat&&max>0)items.push({cat,max});
  }
  if(!items.length){showToast('أضف بنداً واحداً على الأقل','w');return;}
  const total=items.reduce((a,x)=>a+x.max,0);
  if(total!==100){showToast('مجموع البنود يجب أن يساوي 100 (حالياً '+total+')','w');return;}
  showToast('جاري حفظ البنود...','i');
  try{
    const r=await jsonpCall({action:'saveRubric',data:JSON.stringify({code,items})});
    if(r&&r.status!=='ok'&&r.ok!==true){showToast('تعذّر الحفظ'+(r.hint?' — '+r.hint:''),'e');return;}
    document.getElementById('rubModal').remove();
    showToast('✅ تم حفظ بنود الدرجات','s');
    await loadRubrics();
    if(user.role==='t')showTPage('grades',document.getElementById('sn-grades'));
    else showAPage('grades',document.getElementById('sn-grades'));
  }catch(e){showToast('تعذّر الاتصال بالخادم','e');}
}
// حفظ الدرجات التفصيلية
async function saveDetailGrades(code,course){
  const ss=students.filter(s=>s.course===course&&isActive(s.status));
  const rub=rubricFor(code);
  const cid='rb_'+normCode(code).replace(/[^a-z0-9]/gi,'');
  const details=[],totals=[];
  ss.forEach(s=>{
    if(isDeprived(s.abs))return;
    const sk=String(s.key).replace(/'/g,'');
    let sum=0,any=false;
    rub.forEach(r=>{
      const inp=document.querySelector('.'+cid+'[data-key="'+sk+'"][data-cat="'+CSS.escape(String(r.cat))+'"]');
      const v=inp?inp.value:'';
      if(v!==''&&v!=null){const g=parseFloat(v)||0;details.push({key:s.key,cat:r.cat,grade:g});sum+=g;any=true;}
    });
    if(any)totals.push({key:s.key,sid:s.sid,grp:s.grp,total:Math.round(sum*10)/10});
  });
  if(!details.length){showToast('أدخل درجة واحدة على الأقل','w');return;}
  showToast('جاري حفظ الدرجات...','i');
  try{
    const r=await jsonpCall({action:'saveDetailGrades',data:JSON.stringify({code,grp:(ss[0]||{}).grp,details,totals})});
    if(r&&r.status!=='ok'&&r.ok!==true){showToast('تعذّر الحفظ'+(r.hint?' — '+r.hint:''),'e');return;}
    showToast('✅ تم حفظ الدرجات ('+r.updated+' طالب)','s');
    await loadRubrics();
  }catch(e){showToast('تعذّر الاتصال بالخادم','e');}
}

function handleFiles(event,course){
  const fls=Array.from(event.target.files);
  if(!files[course])files[course]=[];
  fls.forEach(f=>{
    if(!files[course].find(x=>x.name===f.name)){
      files[course].push({name:f.name,url:URL.createObjectURL(f),size:f.size});
    }
  });
  refreshFileList(course);
  // update student attachments
  courses.forEach(c=>{if(c.course===course&&!files[c.key])files[c.key]=files[course]});
  showToast(`تم رفع ${fls.length} ملف بنجاح`,'s');
}

function handleDrop(event,course){
  event.preventDefault();
  event.currentTarget.classList.remove('drag');
  const fls=Array.from(event.dataTransfer.files);
  if(!files[course])files[course]=[];
  fls.forEach(f=>files[course].push({name:f.name,url:URL.createObjectURL(f)}));
  refreshFileList(course);
  showToast(`تم رفع ${fls.length} ملف`,'s');
}

function delFile(course,name){
  if(files[course])files[course]=files[course].filter(f=>f.name!==name);
  refreshFileList(course);
}

function refreshFileList(course){
  const fl=document.getElementById('fl-'+course.replace(/\s/g,'_'));
  if(!fl)return;
  fl.innerHTML=(files[course]||[]).map(f=>`<div class="file-item"><span>📄</span><span class="fi-name">${esc(f.name)}</span><button class="fi-del" onclick="delFile('${course}','${esc(f.name)}')">✕</button></div>`).join('');
}

// ===== KPI لكل شعبة =====
function computeKPI(grp){
  // grp = 'all' أو رقم الشعبة
  const gs = grp==='all' ? students : students.filter(s=>s.grp===grp);
  const ids = new Set(gs.map(s=>s.id));
  const gc = allCourses.filter(c=>ids.has(c.sid));
  const traineeCount = gs.length;
  const avg = avgPct(gc);
  // نسبة إكمال الخطة = المواد المأخوذة ÷ إجمالي مواد الخطة الدراسية
  let planTotal = catalog.length;
  if(!planTotal){
    // احتياطي: أكبر عدد مواد أخذها متدرب = الخطة الكاملة
    const cnt={}; allCourses.forEach(c=>cnt[c.sid]=(cnt[c.sid]||0)+1);
    planTotal = Math.max(1, ...Object.values(cnt).concat([1]));
  }
  const cnt={}; gc.forEach(c=>cnt[c.sid]=(cnt[c.sid]||0)+1);
  const compVals = gs.map(s=>Math.min((cnt[s.id]||0)/planTotal,1));
  const completionRate = compVals.length?Math.round(compVals.reduce((a,b)=>a+b,0)/compVals.length*100):0;
  // نسبة التفوق = المواد بدرجة 80%+
  const excellenceRate = gc.length?Math.round(gc.filter(c=>c.pct>=80).length/gc.length*100):0;
  const passRate = gc.length?Math.round(gc.filter(c=>c.pct>=60).length/gc.length*100):0;
  const avgAbs = gc.length?Math.round(gc.reduce((a,c)=>a+c.abs,0)/gc.length):0;
  const alerts = gc.filter(hasIssue).length;
  const gpa = gpaFrom(gc);
  return {traineeCount,avg,completionRate,excellenceRate,passRate,avgAbs,alerts,courseCount:gc.length,gpa,planTotal};
}

  if(grp==='all'){
    // مقارنة الشعب الثلاث جنباً إلى جنب
    const grps=[...new Set(students.map(s=>s.grp))].sort();
    const data=grps.map(g=>({g,...computeKPI(g)}));
    const metrics=[
      {key:'avg',lbl:'متوسط الدرجات',suf:'%'},
      {key:'completionRate',lbl:'نسبة إكمال الخطة',suf:'%'},

    // تحريك القياس الدائري
    setTimeout(()=>{const arc=document.getElementById('gaugeArc');if(arc)arc.style.strokeDashoffset=dash;},100);
  }
}

// ===== فحص المتطلبات السابقة عند التسجيل الجماعي =====
// حالة مادة معيّنة لطالب معيّن: none | current | passed | failed
function studentCourseState(sid, code){
  const recs=(allCourses||[]).filter(c=>String(c.sid)===String(sid)&&normCode(c.code)===normCode(code));
  if(!recs.length)return 'none';
  if(recs.some(c=>isActive(c.status)))return 'current'; // مسجّل حالياً
  if(recs.some(c=>!isFailed(c)))return 'passed'; // اجتاز إحدى المحاولات السابقة
  return 'failed'; // كل السجلات سابقة وراسب فيها → يعيدها
}
// تطبيع نص لمطابقة رموز المواد (أرقام + حروف عربي/لاتيني فقط)
function normTok(s){ return String(s||'').replace(/[^0-9\u0600-\u06FFa-zA-Z]/g,'').toLowerCase(); }
// هل اجتاز المتدرب (sid) المادة المطلوبة في نص المتطلب؟
function studentPassedPrereq(sid, prereq){
  if(!prereq||!String(prereq).trim())return true; // لا يوجد متطلب → مسموح
  // المواد التي أخذها المتدرب سابقاً ونجح فيها
  const passed=(allCourses||[]).filter(c=>String(c.sid)===String(sid)&&!isActive(c.status)&&!isFailed(c));
  // نفصل المتطلبات المتعددة (/ ، , ؛ +)
  const parts=String(prereq).split(/[\/،,؛\+]|\sو\s/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length)return true;
  // يُعتبر مستوفياً إذا نجح في مادة تطابق أياً من المتطلبات
  return parts.some(part=>{
    const num=((part.match(/\d+/)||[])[0])||'';
    const alpha=normTok(part.replace(/\d+/g,''));
    if(!num&&!alpha)return true;
    return passed.some(pc=>{
      const codeN=normTok(pc.code)+normTok(pc.course);
      return (!num||codeN.includes(num))&&(!alpha||codeN.includes(alpha));
    });
  });
}
// قفل صناديق المواد التي لم يستوفِ متطلبها المتدربون المحددون
function applyPrereqLocks(){
  const sids=[...document.querySelectorAll('.enr-student-cb:checked')].map(c=>c.value);
  document.querySelectorAll('.enr-course-cb').forEach(cb=>{
    const code=(cb.value||'').split('|')[0];
    const cat=(catalog||[]).find(c=>normCode(c.code)===normCode(code));
    const prereq=cat?cat.prereq:'';
    const wrap=cb.closest('label');
    const old=wrap?wrap.querySelector('.prereq-lock'):null; if(old)old.remove();
    let blocked=false, missing='';
    if(prereq && sids.length){
      // مقفلة إذا وُجد متدرب واحد على الأقل لم يستوفِ المتطلب
      for(const sid of sids){ if(!studentPassedPrereq(sid,prereq)){ blocked=true; missing=prereq; break; } }
    }
    cb.disabled=blocked;
    if(blocked){
      cb.checked=false;
      if(wrap){
        wrap.style.opacity='.55';
        const tag=document.createElement('span');
        tag.className='prereq-lock';
        tag.style.cssText='font-size:10px;background:rgba(231,76,60,.15);color:#e74c3c;border:1px solid rgba(231,76,60,.35);border-radius:10px;padding:2px 8px;font-weight:700;white-space:nowrap';
        tag.textContent='🔒 المتطلب: '+missing;
        wrap.appendChild(tag);
      }
    }else if(wrap){ wrap.style.opacity=''; }
  });
  updateEnrCountsRaw();
}

// تنسيق عرض الفصل: القيم المخزّنة تبقى «ترم ...» لكن يُعرض للمستخدم «الفصل ...»
function fmtTerm(v){
  return String(v||'')
    .replace('ترم أول','الفصل الأول')
    .replace('ترم ثاني','الفصل الثاني')
    .replace('ترم صيفي','الفصل الصيفي')
    .replace(/(^|\s)ترم(\s)/g,'$1الفصل$2');
}

async function enrollBatch(){
  const sids=[...document.querySelectorAll('.enr-student-cb:checked')].map(c=>c.value);
  const crs=[...document.querySelectorAll('.enr-course-cb:checked')].map(c=>c.value);
  const trainer=document.getElementById('enr_trainer')?.value||'';
  const term=document.getElementById('enr_term')?.value||'';
  // الترم الصيفي ما له نصف مجزأ
  const half=term.includes('صيفي')?'':(document.getElementById('enr_half')?.value||'');
  if(!sids.length){showToast('اختر متدرباً واحداً على الأقل','w');return;}
  if(!crs.length){showToast('اختر مقرراً واحداً على الأقل','w');return;}
  const total=sids.length*crs.length;
  if(!confirm(`سيتم تسجيل ${sids.length} متدرب في ${crs.length} مقرر (${total} تسجيل).\nالفصل التدريبي: ${fmtTerm(term)}${half?' · '+half:''}\nهل تريد المتابعة؟`))return;
  // بناء السجلات (مع تخطي المسجّلين مسبقاً والمواد المقفلة بمتطلب)
  const records=[];let skipped=0,lockedSkip=0;
  sids.forEach(sid=>{
    const st=students.find(s=>s.id===sid);if(!st)return;
    crs.forEach(cv=>{
      const [code,course]=cv.split('|');
      const cat=(catalog||[]).find(c=>normCode(c.code)===normCode(code));
      if(cat&&cat.prereq&&!studentPassedPrereq(sid,cat.prereq)){lockedSkip++;return;} // متطلب غير مستوفى
      const state=studentCourseState(sid,code);
      if(state==='current'||state==='passed'){skipped++;return;} // مسجّل حالياً أو اجتازها → تخطَّ (الراسب يُعاد)
      records.push({sid,name:st.name,grp:st.grp,code,course,trainer,term,half,status:'حالي'});
    });
  });
  if(!records.length){showToast(lockedSkip?'⚠️ كل المواد المختارة مقفلة بمتطلب غير مستوفى':'⚠️ كل التسجيلات موجودة مسبقاً','w');return;}
  showToast(`جاري تسجيل ${records.length} تسجيل...`,'i');
  try{
    // نرسل على دفعات (كل دفعة 40 سجل) لتجنّب حدود الرابط
    for(let i=0;i<records.length;i+=40){
      const batch=records.slice(i,i+40);
      await jsonpCall({action:'enrollStudent',data:JSON.stringify(batch)});
    }
    showToast(`✅ تم تسجيل ${records.length} تسجيل`+(skipped?` · تخطّى ${skipped} مسجّل مسبقاً`:'')+(lockedSkip?` · 🔒 ${lockedSkip} مقفلة بمتطلب`:''),'s');
    loadAdmin().then(()=>showAPage('manage_courses',document.getElementById('sn-manage_courses'))).catch(()=>{});
  }catch(e){showToast('تعذّر التسجيل — جرب مرة أخرى','e');}
}
window.toggleGrpStudents=toggleGrpStudents;window.updateEnrCounts=updateEnrCounts;window.enrollBatch=enrollBatch;

  const rec={type,id:g('id'),name:g('name'),ph:g('ph'),email:g('email'),oldId:g('oldid')||g('id')};

// مفتاح اسم متسامح: يزيل التشكيل و«بن/بنت» والألقاب والفراغات ويوحّد الحروف
function _nk(v){
  let t=String(v||'').trim();
  t=t.replace(/[ً-ْـ]/g,'');
  t=t.replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ة/g,'ه');
  t=t.replace(/(^|\s)(بن|بنت|ال|آل|أل)(\s|$)/g,' ');
  t=t.replace(/[\s.\/\\_\-]+/g,'');
  return t;
}
function _updNumPairs(){
  // خريطة القائمة الجديدة حسب مفتاح الاسم
  const nm={}; NEW_TRAINEE_NUMS.forEach(o=>{nm[_nk(o.n)]={num:o.num,name:o.n};});
  const od=x=>String(x||'').replace(/[^0-9]/g,'');
  const seen=new Set();
  const cur=students.filter(s=>{const id=od(s.id);if(!id||seen.has(id))return false;seen.add(id);return true;});
  const pairs=[];
  cur.forEach(s=>{
    const hit=nm[_nk(s.name)];
    const oldId=od(s.id);
    if(hit){
      const changed=od(hit.num)!==oldId;
      pairs.push({name:s.name,oldId,newId:hit.num,matched:true,changed,newName:hit.name});
    }else{
      pairs.push({name:s.name,oldId,newId:'',matched:false,changed:false});
    }
  });
  return pairs;
}
