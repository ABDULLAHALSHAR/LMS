<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة مسك للموارد البشرية</title>
<meta name="theme-color" content="#07386c">
<style>
:root{
  --navy:#07386c;--navy2:#032b57;--teal:#0ca7a5;--teal2:#14b8b2;--ink:#0c1b3a;
  --muted:#74829b;--bg:#f7f9fc;--line:#e5ebf3;--card:#fff;--soft:#effafa;
  --blueSoft:#eef5ff;--purpleSoft:#f7f1ff;--roseSoft:#fff0f3;--shadow:0 12px 35px rgba(21,47,86,.08);
  --radius:18px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
svg{display:block}
a{text-decoration:none;color:inherit}

/* Login */
.login-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 15% 10%,#e9f8f7,transparent 28%),linear-gradient(135deg,#f8fbfd,#eef6f6)}
.login-shell{width:min(1180px,100%);display:grid;grid-template-columns:.95fr 1.05fr;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 85px rgba(7,56,108,.14);border:1px solid #edf1f6}
.login-form{padding:64px 58px;display:flex;flex-direction:column;justify-content:center}
.login-form h1{font-size:31px;margin:0 0 8px}
.login-form .sub{color:var(--muted);margin-bottom:30px}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:800;display:block;margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;border:1px solid #dfe6ef;border-radius:13px;padding:13px 14px;background:#fff;outline:none;transition:.18s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(12,167,165,.1)}
.primary-btn,.ghost-btn,.danger-btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;transition:.18s}
.primary-btn{background:linear-gradient(135deg,var(--teal),#14bdb1);color:#fff;box-shadow:0 8px 22px rgba(12,167,165,.2)}
.primary-btn:hover,.ghost-btn:hover{transform:translateY(-1px)}
.ghost-btn{background:#fff;border:1px solid var(--line);color:var(--ink)}
.danger-btn{background:#fff0f2;color:#c12843;border:1px solid #ffd4dc}
.login-art{background:linear-gradient(145deg,#0b8c86,#08645f);padding:52px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.login-art:before,.login-art:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.login-art:before{width:360px;height:360px;left:-150px;top:-140px}.login-art:after{width:270px;height:270px;right:-100px;bottom:-110px}
.login-logo{width:190px;height:140px;object-fit:contain;background:#fff;border-radius:18px;padding:7px;position:relative;z-index:1}
.login-art h2{font-size:32px;margin:25px 0 10px;position:relative;z-index:1}
.login-art p{color:#d8fffb;max-width:470px;line-height:1.9;position:relative;z-index:1}
.login-features{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:25px;position:relative;z-index:1}
.login-features div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);padding:13px;border-radius:13px;font-size:13px}
.err{background:#fff3f3;color:#be2538;border:1px solid #ffd0d5;padding:11px 12px;border-radius:12px;margin-top:12px;font-size:13px}

/* App layout */
.app{min-height:100vh;display:flex;direction:rtl}
.sidebar{width:270px;position:fixed;right:0;top:0;bottom:0;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:18px 14px;display:flex;flex-direction:column;z-index:20}
.side-head{height:82px;display:flex;align-items:center;gap:10px;padding:0 8px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.side-head img{width:62px;height:62px;background:#fff;border-radius:13px;padding:3px;object-fit:contain}
.side-head b{font-size:15px}.side-head small{display:block;color:#91d8db;margin-top:4px;font-size:10px}
.nav{display:flex;flex-direction:column;gap:4px;padding-top:16px;overflow:auto}
.nav button{border:0;background:transparent;color:#e7f0ff;display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:11px;text-align:right;font-size:13px}
.nav button svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.9;fill:none}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.active{background:linear-gradient(135deg,#10a9aa,#0c97a2);box-shadow:0 8px 18px rgba(0,0,0,.14);color:#fff}
.side-bottom{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:12px}
.logout-btn{width:100%;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.03);color:#fff;border-radius:11px;padding:11px 12px;display:flex;align-items:center;justify-content:center;gap:8px}
.workspace{margin-right:270px;width:calc(100% - 270px);min-height:100vh}
.topbar{height:96px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:15}
.top-brand{display:flex;align-items:center;gap:10px}
.top-brand img{height:70px;width:190px;object-fit:contain}
.top-user{display:flex;align-items:center;gap:13px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#e8f7f6,#d8eaff);display:grid;place-items:center;font-weight:900;color:var(--navy);border:3px solid #fff;box-shadow:0 3px 15px rgba(0,0,0,.08)}
.user-meta b{font-size:14px}.user-meta small{display:block;color:var(--teal);margin-top:4px;font-size:11px}
.top-icons{display:flex;align-items:center;gap:8px;margin-right:18px}
.icon-btn{width:40px;height:40px;border:0;background:#fff;color:var(--navy);border-radius:10px;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:#f4f7fb}.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}
.badge-dot{position:absolute;top:3px;right:2px;background:#079f9e;color:#fff;border:2px solid #fff;min-width:18px;height:18px;padding:0 4px;border-radius:10px;font-size:9px;display:grid;place-items:center}
.content{padding:28px 32px 50px;max-width:1560px;margin:auto}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-head h1{font-size:23px;margin:0}.page-head p{font-size:12px;color:var(--muted);margin:5px 0 0}

/* Dashboard */
.welcome-card{background:linear-gradient(135deg,#f9fdff,#f1f8ff 48%,#fbf7ff);border:1px solid #dfe8f3;border-radius:18px;min-height:240px;display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:24px 34px;box-shadow:var(--shadow);overflow:hidden}
.welcome-logo{display:flex;align-items:center;justify-content:center;border-left:1px solid #d9e3ef;min-height:160px}.welcome-logo img{width:190px;height:140px;object-fit:contain}
.welcome-copy{padding:0 28px;text-align:right}.welcome-copy h2{font-size:27px;margin:0 0 8px}.welcome-copy h2 span{color:var(--teal)}.welcome-copy h3{color:var(--teal);font-size:14px;margin:0 0 15px}.welcome-copy p{font-size:13px;color:var(--muted);line-height:1.9;margin:0}
.hero-visual{display:flex;align-items:center;justify-content:center}.hero-visual svg{max-width:245px;width:100%;height:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:22px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px 22px;min-height:142px;box-shadow:0 8px 26px rgba(22,43,76,.04);position:relative}
.kpi-icon{width:45px;height:45px;border-radius:12px;display:grid;place-items:center;position:absolute;left:20px;top:20px}
.kpi-icon svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
.kpi-icon.blue{background:#ecf4ff;color:#3275d3}.kpi-icon.rose{background:#fff0f3;color:#e34c70}.kpi-icon.teal{background:#e9f8f5;color:#1a9d8b}.kpi-icon.purple{background:#f5efff;color:#8a4ee8}
.kpi-num{font-size:28px;font-weight:900}.kpi-label{font-size:12px;color:var(--muted);margin-top:6px}.kpi-link{position:absolute;bottom:15px;right:20px;color:#2675cc;font-size:11px}
.dashboard-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px 20px;box-shadow:0 8px 26px rgba(22,43,76,.04)}
.panel-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:8px}
.panel-head h3{font-size:16px;margin:0}.link-btn{border:0;background:transparent;color:#2675cc;font-size:11px}
.session-row{display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center;padding:12px 2px;border-bottom:1px solid #edf1f6}
.session-row:last-child{border-bottom:0}.date-box{border-radius:9px;padding:7px;text-align:center;font-weight:800;background:#eaf8f6;color:#0b8b86}.date-box.blue{background:#edf5ff;color:#2876c8}.date-box.purple{background:#f6efff;color:#8c4bdb}.date-box b{display:block;font-size:19px}.date-box span{font-size:10px}
.session-info b{font-size:13px}.session-info small{display:block;color:var(--muted);font-size:10px;margin-top:5px}
.course-mini{display:grid;grid-template-columns:105px 1fr;gap:13px;padding:11px 0;border-bottom:1px solid #edf1f6}.course-mini:last-child{border-bottom:0}
.course-thumb{height:66px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;background:linear-gradient(135deg,#193b65,#2996a1);overflow:hidden;position:relative}
.course-thumb.hr{background:linear-gradient(135deg,#3d6e83,#a87b56)}.course-thumb.sa{background:linear-gradient(135deg,#0d6b4b,#0a9c64)}.course-thumb.ai{background:linear-gradient(135deg,#4a3980,#2676b5)}
.course-mini b{font-size:12px}.course-mini small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.progress{height:4px;background:#e8edf3;border-radius:8px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#12a381;border-radius:8px}.progress.warn i{background:#efb331}.progress.bad i{background:#ec3153}

/* Generic pages */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.course-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 25px rgba(22,43,76,.04)}
.course-cover{height:120px;background:linear-gradient(135deg,#0e4577,#0ca7a5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;position:relative}.course-cover:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);left:-35px;top:-40px}
.course-body{padding:16px}.course-code{font-size:10px;color:var(--teal);font-weight:900}.course-body h3{font-size:15px;margin:7px 0}.course-body p{font-size:11px;color:var(--muted);line-height:1.7;min-height:38px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.chip{font-size:10px;background:#f1f5f9;color:#526174;padding:5px 8px;border-radius:20px}.chip.teal{background:#eaf9f7;color:#0b8b86}
.table-box{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}
table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:12px 13px;border-bottom:1px solid var(--line);font-size:11px;text-align:right;white-space:nowrap}th{background:#f7f9fc;color:#61708a;font-weight:800}tr:last-child td{border-bottom:0}
.status{display:inline-flex;padding:5px 9px;border-radius:20px;font-size:10px;font-weight:800}.ok{background:#e9f8ef;color:#188450}.warn{background:#fff5da;color:#956716}.bad{background:#fff0f2;color:#bd3448}.info{background:#edf5ff;color:#2a6cb5}
.toolbar{display:flex;gap:9px;align-items:center}.search{border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:240px;outline:none}
.empty{text-align:center;color:var(--muted);padding:40px}
.list-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.calendar-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px}.calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-right:1px solid var(--line)}.cal-name,.cal-day{min-height:94px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;font-size:11px}.cal-name{min-height:auto;background:#f8fafc;text-align:center;font-weight:800}.cal-day.muted{background:#fafbfd;color:#bac3d0}.cal-day b{font-size:11px}.cal-event{margin-top:7px;background:#eaf9f7;color:#0a827f;padding:5px;border-radius:6px;font-size:9px;overflow:hidden;text-overflow:ellipsis}
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.bar-row{display:grid;grid-template-columns:150px 1fr 45px;gap:10px;align-items:center;margin:13px 0;font-size:11px}.bar{height:8px;background:#edf1f6;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#3b82f6)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.modal{position:fixed;inset:0;background:rgba(8,23,46,.48);display:grid;place-items:center;padding:20px;z-index:60}.modal-card{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.18)}.modal-card h3{margin:0 0 18px}.modal-actions{display:flex;gap:9px;justify-content:flex-start;margin-top:15px}
.notice{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:start;padding:14px 2px;border-bottom:1px solid var(--line)}.notice:last-child{border-bottom:0}.notice-ico{width:40px;height:40px;border-radius:11px;background:#eaf9f7;color:var(--teal);display:grid;place-items:center}.notice b{font-size:12px}.notice p{font-size:11px;color:var(--muted);margin:5px 0}.notice small{font-size:10px;color:#9aa5b5}
.toast{position:fixed;left:24px;bottom:24px;background:#0b2347;color:#fff;padding:12px 16px;border-radius:11px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.18);font-size:12px}

@media(max-width:1100px){.welcome-card{grid-template-columns:1fr 1.4fr}.hero-visual{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.sidebar{width:74px;padding:12px 8px}.side-head div,.nav button em,.side-bottom span{display:none}.side-head{justify-content:center}.side-head img{width:50px;height:50px}.nav button{justify-content:center;padding:12px 8px}.workspace{margin-right:74px;width:calc(100% - 74px)}.top-brand{display:none}.content{padding:18px 14px}.welcome-card{grid-template-columns:1fr;padding:20px}.welcome-logo{border:0;border-bottom:1px solid var(--line)}.welcome-copy{text-align:center;padding:20px 0}.dashboard-grid,.report-grid,.settings-grid{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.topbar{padding:0 14px}.top-icons{margin:0}.user-meta{display:none}}
@media(max-width:520px){.kpis{grid-template-columns:1fr}.login-shell{grid-template-columns:1fr}.login-art{display:none}.login-form{padding:38px 24px}.calendar-grid{min-width:700px}.calendar-wrap{overflow:auto}}
</style>
</head>
<body>

<section id="loginView" class="login-page">
  <div class="login-shell">
    <div class="login-form">
      <h1>تسجيل الدخول</h1>
      <div class="sub">استخدم رقمك الوظيفي للدخول إلى حسابك.</div>
      <div class="field"><label>الرقم الوظيفي</label><input id="loginId" autocomplete="username" placeholder="الرقم الوظيفي"></div>
      <div class="field"><label>PIN</label><input id="loginPin" type="password" autocomplete="current-password" placeholder="••••"></div>
      <button class="primary-btn" onclick="login()">دخول إلى المنصة</button>
      <div id="loginError" class="err hidden"></div>
    </div>
    <div class="login-art">
      <img class="login-logo" data-misk-logo="1" alt="منصة مسك">
      <h2>منصة مسك للموارد البشرية</h2>
      <p>منصة داخلية لتدريب الموظفين، إدارة البرامج التدريبية، متابعة الحضور والنتائج وإصدار الشهادات.</p>
      <div class="login-features"><div>📚 إدارة الدورات</div><div>👥 تدريب الموظفين</div><div>✅ حضور وتقييم</div><div>🏅 شهادات وإنجازات</div></div>
    </div>
  </div>
</section>

<section id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="side-head"><img data-misk-logo="1"><div><b>منصة مسك</b><small>للموارد البشرية</small></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="side-bottom"><button class="logout-btn" onclick="logout()"><span>تسجيل الخروج</span><b>↩</b></button></div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="top-brand"><img data-misk-logo="1" alt="منصة مسك"></div>
      <div style="display:flex;align-items:center">
        <div class="top-icons">
          <button class="icon-btn" onclick="showPage('notifications')" title="الإشعارات"><span id="notifBadge" class="badge-dot hidden">0</span><span id="bellIcon"></span></button>
          <button class="icon-btn" onclick="refreshData()" title="تحديث"><span id="refreshIcon"></span></button>
        </div>
        <div class="top-user"><div id="avatar" class="avatar">م</div><div class="user-meta"><b id="topUserName">—</b><small id="topUserTitle">—</small></div></div>
      </div>
    </header>
    <main id="content" class="content"></main>
  </div>
</section>

<div id="modal" class="modal hidden"></div>

function api(action,payload={}){
  return new Promise((resolve,reject)=>{
    if(!SCRIPT_URL||!SCRIPT_URL.includes('/exec'))return reject(new Error('رابط Google Apps Script غير صحيح'));
    const cb='misk_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const timer=setTimeout(()=>done(new Error('تعذر الوصول إلى خادم المنصة. تحقق من نشر Web App بصلاحية Anyone ثم أعد المحاولة.')),18000);
    function done(err,data){clearTimeout(timer);try{delete window[cb]}catch(_){window[cb]=undefined}s.remove();err?reject(err):resolve(data)}
    window[cb]=(j)=>{if(!j||j.ok===false)return done(new Error(j?.error||'تعذر تنفيذ الطلب'));done(null,j.data??j)};
    const q=new URLSearchParams({action,callback:cb,token:TOKEN,payload:JSON.stringify(payload)});
    s.src=SCRIPT_URL+'?'+q.toString();s.onerror=()=>done(new Error('تعذر الاتصال بـ Google Apps Script. تحقق من إعدادات النشر.'));document.body.appendChild(s);
  })
}

function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}
async function login(){
  $('loginError').classList.add('hidden');
  try{
    await api('health');
    const r=await api('login',{id:$('loginId').value.trim(),pin:$('loginPin').value.trim()});
    TOKEN=r.token;localStorage.setItem('miskHrToken',TOKEN);DATA=await api('bootstrap');openApp();
  }catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden')}
}
async function logout(){try{await api('logout')}catch(_){ }TOKEN='';DATA=null;localStorage.removeItem('miskHrToken');$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
async function restore(){if(!TOKEN)return;try{DATA=await api('bootstrap');openApp()}catch(_){TOKEN='';localStorage.removeItem('miskHrToken')}}
async function refreshData(){try{DATA=await api('bootstrap');updateHeader();render();toast('تم تحديث البيانات')}catch(e){toast(e.message)}}

function initials(name){return String(name||'م').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('')}
function openApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');buildNav();updateHeader();showPage('dashboard')}
function updateHeader(){
  $('topUserName').textContent=DATA.user.name||'—';$('topUserTitle').textContent=DATA.user.title||roleAr(DATA.user.role);$('avatar').textContent=initials(DATA.user.name);
  const n=(DATA.notifications||[]).filter(x=>val(x,'الحالة')==='غير مقروء').length;$('notifBadge').textContent=n;$('notifBadge').classList.toggle('hidden',!n)
}
function navItems(){
 const base=[['dashboard','home','الرئيسية'],['courses','book','الدورات التدريبية'],['sessions','calendar','الجلسات التدريبية'],['requests','request',DATA.user.role==='employee'?'طلباتي التدريبية':'طلبات التدريب'],['calendar','calendar','التقويم'],['certificates','cert','الشهادات']];
 if(DATA.user.role==='admin')return [...base,['reports','report','التقارير'],['employees','users','الموظفون'],['trainers','trainer','المدربون'],['notifications','bell','الإشعارات'],['settings','settings','الإعدادات']];
 if(DATA.user.role==='trainer')return [...base,['reports','report','التقارير'],['notifications','bell','الإشعارات']];
 return [...base,['notifications','bell','الإشعارات']];
}
function buildNav(){$('nav').innerHTML=navItems().map(x=>`<button data-page="${x[0]}" onclick="showPage('${x[0]}')">${ICONS[x[1]]}<em style="font-style:normal">${x[2]}</em></button>`).join('')}
function showPage(p){CURRENT=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function pageHead(t,s,actions=''){return `<div class="page-head"><div><h1>${t}</h1><p>${s||''}</p></div><div class="toolbar">${actions}</div></div>`}
function courseName(c){return (DATA.courses||[]).find(x=>val(x,'رمز الدورة')===c)?.['اسم الدورة']||c}
function userName(id){return (DATA.users||[]).find(x=>x.id===id)?.name||id}
function deptName(code){return (DATA.departments||[]).find(x=>val(x,'رمز الإدارة')===code)?.['الإدارة']||code}
function trainerName(id){return userName(id)}
function sessionById(id){return (DATA.sessions||[]).find(s=>val(s,'رقم الجلسة')===id)}
function enrollmentById(id){return (DATA.enrollments||[]).find(e=>val(e,'رقم التسجيل')===id)}
function status(s){const c=['معتمد','مؤكد','مكتمل','ناجح','صادرة','حاضر','نشط','متاح'].includes(s)?'ok':['قيد المراجعة','بانتظار الموافقة','متأخر','غير مقروء'].includes(s)?'warn':['مرفوض','راسب','غائب','منسحب','موقوف','ملغي'].includes(s)?'bad':'info';return `<span class="status ${c}">${esc(s||'—')}</span>`}

function calendarPage(){
 const y=CAL_DATE.getFullYear(),m=CAL_DATE.getMonth();const first=new Date(y,m,1),last=new Date(y,m+1,0),start=first.getDay();const names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
 let cells=names.map(n=>`<div class="cal-name">${n}</div>`).join('');
 for(let i=0;i<start;i++)cells+=`<div class="cal-day muted"></div>`;
 for(let d=1;d<=last.getDate();d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const ev=(DATA.sessions||[]).filter(s=>String(val(s,'التاريخ'))===ds);cells+=`<div class="cal-day"><b>${d}</b>${ev.map(s=>`<div class="cal-event">${esc(courseName(val(s,'رمز الدورة')))} · ${esc(val(s,'من'))}</div>`).join('')}</div>`}
 $('content').innerHTML=pageHead('التقويم','عرض الجلسات التدريبية حسب الشهر')+`<div class="calendar-wrap"><div class="calendar-head"><button class="ghost-btn" onclick="moveMonth(-1)">‹ السابق</button><b>${CAL_DATE.toLocaleDateString('ar-SA',{month:'long',year:'numeric'})}</b><button class="ghost-btn" onclick="moveMonth(1)">التالي ›</button></div><div class="calendar-grid">${cells}</div></div>`;
}

async function saveSession(id){try{await api('saveSession',{session:{id,courseCode:$('sCourse').value,date:$('sDate').value,from:$('sFrom').value,to:$('sTo').value,location:$('sLoc').value,status:'متاح'}});closeModal();await refreshData();showPage('sessions')}catch(e){toast(e.message)}}
function userModal(role,u={}){
 openModal(`<h3>${u.id?'تعديل':'إضافة'} ${role==='trainer'?'مدرب':'موظف'}</h3><div class="settings-grid"><div class="field"><label>الرقم</label><input id="uId" value="${esc(u.id||'')}" ${u.id?'readonly':''}></div><div class="field"><label>الاسم</label><input id="uName" value="${esc(u.name||'')}"></div><div class="field"><label>المسمى الوظيفي</label><input id="uTitle" value="${esc(u.title||'')}"></div><div class="field"><label>الإدارة</label><select id="uDept">${(DATA.departments||[]).map(d=>`<option value="${esc(val(d,'رمز الإدارة'))}" ${u.departmentCode===val(d,'رمز الإدارة')?'selected':''}>${esc(val(d,'الإدارة'))}</option>`).join('')}</select></div><div class="field"><label>الجوال</label><input id="uMobile" value="${esc(u.mobile||'')}"></div><div class="field"><label>البريد</label><input id="uEmail" value="${esc(u.email||'')}"></div><div class="field"><label>PIN ${u.id?'(اتركه فارغاً للإبقاء عليه)':''}</label><input id="uPin" value=""></div></div><div class="modal-actions"><button class="primary-btn" onclick="saveUser('${role}')">حفظ</button><button class="ghost-btn" onclick="closeModal()">إلغاء</button></div>`);
}
async function saveUser(role){try{await api('saveUser',{user:{id:$('uId').value,name:$('uName').value,role,title:$('uTitle').value,departmentCode:$('uDept').value,mobile:$('uMobile').value,email:$('uEmail').value,pin:$('uPin').value,status:'نشط'}});closeModal();await refreshData();showPage(role==='trainer'?'trainers':'employees')}catch(e){toast(e.message)}}
function requestModal(code){openModal(`<h3>طلب التسجيل في دورة</h3><p style="font-size:12px;color:var(--muted)">${esc(courseName(code))}</p><div class="field"><label>سبب أو ملاحظة الطلب</label><textarea id="reqText" rows="4" placeholder="اكتب سبب رغبتك في الدورة"></textarea></div><div class="modal-actions"><button class="primary-btn" onclick="submitRequest('${esc(code)}')">إرسال الطلب</button><button class="ghost-btn" onclick="closeModal()">إلغاء</button></div>`)}
async function submitRequest(code){try{await api('requestCourse',{courseCode:code,details:$('reqText').value});closeModal();await refreshData();toast('تم إرسال الطلب')}catch(e){toast(e.message)}}
async function reviewReq(id,statusVal){try{await api('reviewRequest',{requestId:id,status:statusVal});await refreshData();showPage('requests')}catch(e){toast(e.message)}}
async function markRead(id){try{await api('markNotificationRead',{notificationId:id});await refreshData();showPage('notifications')}catch(e){toast(e.message)}}
async function saveSettings(){try{await api('saveSettings',{settings:{PlatformName:$('setName').value,OrganizationName:$('setOrg').value,PassingScore:$('setPass').value,AttendanceRequired:$('setAtt').value,SupportEmail:$('setMail').value,AcademicYear:$('setYear').value}});await refreshData();toast('تم حفظ الإعدادات')}catch(e){toast(e.message)}}

$('loginPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

document.querySelectorAll('[data-misk-logo]').forEach(img=>img.src=MISK_LOGO);
restore();
</script>
</body>
</html>
